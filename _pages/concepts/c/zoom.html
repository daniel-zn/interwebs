html,body{margin:0;height:100%;background:#0d0c0a;color:var(--hud-ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

.back{top:calc(14px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));text-decoration:none;padding:8px 10px 8px 0;color:#fff}
.back:hover,.back:focus-visible{text-decoration:underline;text-underline-offset:4px}
#readout{left:calc(16px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:none;color:#fff;text-transform:none;letter-spacing:0}
#readout .mag{font-family:var(--serif);font-size:54px;line-height:.9;letter-spacing:-.01em}
#readout .mag sup{font-size:.46em;vertical-align:top;position:relative;top:.08em;margin-left:.04em;font-variant-numeric:tabular-nums}
#readout .row{font-family:var(--mono);font-size:11px;letter-spacing:.06em;margin-top:8px;text-transform:uppercase;opacity:.85;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis}
#readout .fine{opacity:.6}
#indexBtn{top:calc(12px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));background:none;border:1px solid currentColor;color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:7px 10px;cursor:pointer;border-radius:0}
#indexBtn:hover,#indexBtn:focus-visible{background:#fff;color:#000}
#gauge{position:fixed;z-index:4;right:calc(10px + env(safe-area-inset-right));top:64px;bottom:64px;width:64px;mix-blend-mode:difference;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#gauge .rail{position:absolute;right:14px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.45)}
#gauge button{position:absolute;right:0;width:64px;height:14px;margin-top:-7px;background:none;border:0;padding:0;cursor:pointer;color:#fff}
#gauge button::after{content:"";position:absolute;right:14px;top:6px;width:8px;height:1px;background:currentColor;opacity:.75}
#gauge button.major::after{width:16px}
#gauge button span{position:absolute;right:38px;top:-1px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;white-space:nowrap;opacity:0;transform:translateX(6px);transition:opacity .2s,transform .2s;pointer-events:none;text-transform:none}
#gauge:hover button span{opacity:.55;transform:none}
#gauge button:hover span,#gauge button:focus-visible span,#gauge button.cur span{opacity:1;transform:none}
#gauge button:focus-visible{outline:1px solid #fff}
#gauge .marker{position:absolute;right:6px;width:17px;height:17px;margin-top:-8.5px;border:1.5px solid #fff;border-radius:50%;pointer-events:none}
#gauge .marker::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;background:#fff;border-radius:50%}
#hint{position:fixed;z-index:5;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;mix-blend-mode:difference;pointer-events:none;transition:opacity .8s;white-space:nowrap;display:flex;gap:10px;align-items:center}
#hint i{display:inline-block;width:1px;height:18px;background:#fff;animation:fall 1.6s ease-in infinite;transform-origin:top}
@keyframes fall{0%{transform:scaleY(0);opacity:1}70%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1) translateY(6px);opacity:0}}
#hint.gone{opacity:0}
/* details panel: a specimen card */
.sheet{position:fixed;z-index:20;background:var(--paper);color:var(--ink);font-family:var(--sans);box-shadow:0 30px 80px rgba(0,0,0,.45);display:none;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet.open{display:block;animation:rise .35s cubic-bezier(.2,.8,.2,1)}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);background:none;color:var(--ink);padding:10px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border-radius:0}
.btn.solid{background:var(--ink);color:var(--paper)}

.x{position:absolute;top:10px;right:10px;width:34px;height:34px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font:18px/1 var(--mono);cursor:pointer;border-radius:0}

#index{inset:0;padding:calc(56px + env(safe-area-inset-top)) 24px 40px}
#index .wrap{max-width:980px;margin:0 auto}
#index h2{font-size:56px}
#index ol{list-style:none;margin:24px 0 0;padding:0;border-top:1px solid var(--ink)}
#index li{display:grid;grid-template-columns:44px 1fr auto;gap:4px 16px;padding:12px 0;border-bottom:1px solid rgba(22,20,15,.25);align-items:baseline}
#index .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
#index li button{background:none;border:0;padding:0;font-family:var(--serif);font-size:26px;color:var(--ink);text-align:left;cursor:pointer;line-height:1.1}
#index li button:hover,#index li button:focus-visible{color:var(--verm);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
#index .meta{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;text-align:right}
#index .ln{grid-column:2/4;font-size:14px;line-height:1.45;color:#3c372e}

#loader{position:fixed;inset:0;z-index:30;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .9s}

#loader .row{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#loader .bar{width:160px;height:1px;background:rgba(22,20,15,.2);position:relative}
#loader .bar b{position:absolute;left:0;top:0;bottom:0;background:var(--ink);width:0;transition:width .2s}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* glyph anatomy: find the tittle of an i, a full stop, or the counter of a B in the real font */
const blobCache={};
function glyphBlob(ch,fam,pre,mode){
  const key=ch+fam+pre+mode; if(blobCache[key])return blobCache[key];
  const S=200,c=document.createElement('canvas');c.width=c.height=400;const g=c.getContext('2d',{willReadFrequently:true});
  g.font=fnt(S,fam,pre);g.fillStyle='#000';g.fillText(ch,100,300);
  let d;try{d=g.getImageData(0,0,400,400).data}catch(e){return {dx:.12,dy:-.08,r:.05}}
  const ink=new Uint8Array(160000);for(let i=0;i<160000;i++)ink[i]=d[i*4+3]>110?1:0;
  const lab=new Int32Array(160000);let n=0;const comps=[];
  const fill=(start,pred)=>{const st=[start];n++;let sx=0,sy=0,cnt=0;lab[start]=n;
    while(st.length){const p=st.pop();const x=p%400,y=(p/400)|0;sx+=x;sy+=y;cnt++;
      for(const q of [p-1,p+1,p-400,p+400]){if(q<0||q>=160000)continue;if(Math.abs((q%400)-x)>1)continue;if(!lab[q]&&pred(q)){lab[q]=n;st.push(q)}}}
    return{cx:sx/cnt,cy:sy/cnt,a:cnt,id:n}};
  let res;
  if(mode==='counter'){
    fill(0,q=>!ink[q]); // outside
    for(let i=0;i<160000;i++)if(!ink[i]&&!lab[i])comps.push(fill(i,q=>!ink[q]));
    comps.sort((a,b)=>a.cy-b.cy); // top counter first
    res=comps[0];
  }else{
    for(let i=0;i<160000;i++)if(ink[i]&&!lab[i])comps.push(fill(i,q=>ink[q]));
    comps.sort((a,b)=>a.cy-b.cy);
    res=mode==='top'?comps[0]:comps[comps.length-1];
  }
  if(!res)return {dx:.12,dy:-.08,r:.05};
  return blobCache[key]={dx:(res.cx-100)/S,dy:(res.cy-300)/S,r:Math.sqrt(res.a/Math.PI)/S};
}

const cv=document.getElementById('c');const ctx=cv.getContext('2d');
let now=0;
function comp(A,B){return{k:A.k*B.k,x:A.k*B.x+A.x,y:A.k*B.y+A.y}}
function childT(S){const f=1/S.F,p=S.portal;return{k:f,x:p.x*(1-f),y:p.y*(1-f)}}
function setT(Tr){ctx.setTransform(dpr*Tr.k,0,0,dpr*Tr.k,dpr*Tr.x,dpr*Tr.y)}

function drawImg(it,Tr,vx0,vy0,vx1,vy1){
  const im=IM[it.id];
  if(!ready(it.id)){ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(it.x,it.y,it.w,it.h);return}
  const nw=im.naturalWidth,nh=im.naturalHeight;
  const ax=Math.max(it.x,vx0),ay=Math.max(it.y,vy0),bx=Math.min(it.x+it.w,vx1),by=Math.min(it.y+it.h,vy1);
  if(ax>=bx||ay>=by)return;
  const sxs=nw/it.w,sys=nh/it.h;
  let sx0=Math.floor((ax-it.x)*sxs),sy0=Math.floor((ay-it.y)*sys),sx1=Math.ceil((bx-it.x)*sxs),sy1=Math.ceil((by-it.y)*sys);
  sx0=clamp(sx0,0,nw-1);sy0=clamp(sy0,0,nh-1);sx1=clamp(sx1,sx0+1,nw);sy1=clamp(sy1,sy0+1,nh);
  const devPerPx=Tr.k*dpr*it.w/nw;
  ctx.imageSmoothingEnabled=devPerPx<3;ctx.imageSmoothingQuality='high';
  ctx.drawImage(im,sx0,sy0,sx1-sx0,sy1-sy0,it.x+sx0/sxs,it.y+sy0/sys,(sx1-sx0)/sxs,(sy1-sy0)/sys);
  if(devPerPx>=6){ // inside a picture: show the pixel lattice faintly
    const step=it.w/nw;const a=Math.min(.18,(devPerPx-6)/60);
    ctx.strokeStyle='rgba(0,0,0,'+a+')';ctx.lineWidth=1/(Tr.k*dpr);ctx.beginPath();
    const gx0=it.x+sx0*step,gy0=it.y+sy0*(it.h/nh);
    for(let x=sx0;x<=sx1;x++){const X=it.x+x*step;ctx.moveTo(X,Math.max(ay,it.y+sy0/sys));ctx.lineTo(X,Math.min(by,it.y+sy1/sys))}
    for(let y=sy0;y<=sy1;y++){const Y=it.y+y/sys;ctx.moveTo(Math.max(ax,gx0),Y);ctx.lineTo(Math.min(bx,it.x+sx1/sxs),Y)}
    ctx.stroke();
  }
}

function drawCaption(S,Tr,alpha){
  const p=S.portal,it=S.items.find(o=>o.t==='cap');if(!it)return;
  const f1=fnt(phone?9.5:10.5,FM),f2=fnt(phone?16:19,FS,'italic');

  let left=p.x>W*.58;if(!left&&p.x+d*.72+22+w>lim)left=true;if(left&&p.x-d*.72-22-w<8)left=false;
  const up=p.y>H*.62;

function drawReticle(S,Tr,alpha){
  const p=S.portal;ctx.globalAlpha=alpha;
  const pulse=(Math.sin(now/520)+1)/2;
  const R=p.r+5+pulse*4;
  ctx.strokeStyle=S.acc;ctx.lineWidth=1.25/Tr.k;
  ctx.beginPath();ctx.arc(p.x,p.y,R,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=alpha*(1-pulse)*.7;ctx.beginPath();ctx.arc(p.x,p.y,R+6+pulse*10,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=alpha;ctx.strokeStyle=S.ink;ctx.beginPath();
  for(let a=0;a<4;a++){const c=Math.cos(a*Math.PI/2),s=Math.sin(a*Math.PI/2);ctx.moveTo(p.x+c*(R+3),p.y+s*(R+3));ctx.lineTo(p.x+c*(R+9),p.y+s*(R+9))}
  ctx.stroke();ctx.globalAlpha=1;
}

function drawItems(S,Tr,alpha,tf){
  if(alpha<.01)return;
  const vx0=-Tr.x/Tr.k,vy0=-Tr.y/Tr.k,vx1=(W-Tr.x)/Tr.k,vy1=(H-Tr.y)/Tr.k;
  const pxs=Tr.k*dpr;
  setT(Tr);ctx.textBaseline='alphabetic';
  const capA=alpha*(1-sm(0,.22,tf));
  for(const it of S.items){
    switch(it.t){
    case'text':{
      if(it.size*pxs<1.1)continue;
      const x0=it.align==='right'?it.x-it.w:it.align==='center'?it.x-it.w/2:it.x;
      if(x0>vx1||x0+it.w<vx0||it.y-it.size>vy1||it.y+it.size*.35<vy0)continue;
      ctx.globalAlpha=alpha*it.alpha;ctx.font=it.f;ctx.fillStyle=it.color;ctx.textAlign=it.align;
      if(it.size*pxs<3.5){ctx.globalAlpha*=.6;ctx.fillRect(x0,it.y-it.size*.55,it.w,it.size*.5);continue} // greeked when microscopic
      ctx.fillText(it.s,it.x,it.y);
      if(it.ul){ctx.fillRect(x0,it.y+3,it.w,1)}
      break}
    case'img':{if(it.x>vx1||it.x+it.w<vx0||it.y>vy1||it.y+it.h<vy0)continue;ctx.globalAlpha=alpha;drawImg(it,Tr,vx0,vy0,vx1,vy1);break}
    case'brackets':{ctx.globalAlpha=alpha;ctx.strokeStyle=it.color;ctx.lineWidth=1/Tr.k;const L=10,o=6;ctx.beginPath();
      const X0=it.x-o,Y0=it.y-o,X1=it.x+it.w+o,Y1=it.y+it.h+o;
      ctx.moveTo(X0,Y0+L);ctx.lineTo(X0,Y0);ctx.lineTo(X0+L,Y0);ctx.moveTo(X1-L,Y0);ctx.lineTo(X1,Y0);ctx.lineTo(X1,Y0+L);
      ctx.moveTo(X1,Y1-L);ctx.lineTo(X1,Y1);ctx.lineTo(X1-L,Y1);ctx.moveTo(X0+L,Y1);ctx.lineTo(X0,Y1);ctx.lineTo(X0,Y1-L);ctx.stroke();break}
    case'crop':{ctx.globalAlpha=alpha;ctx.strokeStyle=it.color;ctx.lineWidth=1/Tr.k;const a=it.ins,L=it.L;ctx.beginPath();
      [[a,a,1,1],[W-a,a,-1,1],[a,H-a,1,-1],[W-a,H-a,-1,-1]].forEach(([x,y,sx,sy])=>{ctx.moveTo(x+sx*L,y);ctx.lineTo(x,y);ctx.lineTo(x,y+sy*L)});ctx.stroke();break}
    case'rule':{ctx.globalAlpha=alpha;ctx.fillStyle=it.color;ctx.fillRect(it.x,it.y,it.w,1/Tr.k>1?1:1);break}
    case'reticle':{if(capA>.01)drawReticle(S,Tr,capA);break}
    case'cap':{if(capA>.01)drawCaption(S,Tr,capA);setT(Tr);break}
    }
  }
  ctx.globalAlpha=1;
}

/* motes: dust falling past you, from the point you are falling into */
const motes=[];for(let k=0;k<110;k++)motes.push({a:Math.random()*Math.PI*2,r:Math.random()*900,s:.6+Math.random()*1.4});
function drawMotes(p,rate,ink,dt){
  const sp=Math.abs(rate);if(sp<.05)return;
  const diag=Math.hypot(W,H);const A=Math.min(.55,sp*.09);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.strokeStyle=ink;ctx.lineCap='round';
  for(const m of motes){
    const g=Math.exp(rate*dt*m.s);const r0=m.r;m.r*=g;
    if(rate>0&&m.r>diag){m.r=2+Math.random()*40;m.a=Math.random()*Math.PI*2;continue}
    if(rate<0&&m.r<2){m.r=diag*(.5+Math.random()*.5);m.a=Math.random()*Math.PI*2;continue}
    const tail=Math.min(m.r*.5,Math.abs(m.r-r0)*2.5+1);
    const c=Math.cos(m.a),s=Math.sin(m.a);const ri=rate>0?m.r-tail:m.r+tail;
    ctx.globalAlpha=A*Math.min(1,m.r/120);ctx.lineWidth=.6+m.s*.8*Math.min(1,m.r/400);
    ctx.beginPath();ctx.moveTo(p.x+c*ri,p.y+s*ri);ctx.lineTo(p.x+c*m.r,p.y+s*m.r);ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function frameTransforms(zz){
  const i=Math.floor(zz+1e-9),t=Math.max(0,zz-i);
  const A=lev(i);const k=Math.pow(A.F,t);const p=A.portal;
  const T0={k,x:p.x*(1-k),y:p.y*(1-k)};const T1=comp(T0,childT(A));
  return{i,t,A,T0,T1,R:p.r*k,full:p.r*k>=A.cov};
}

function render(rate,dt){
  const f=frameTransforms(z);const {i,t,A,T0,T1,R,full}=f;const p=A.portal;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const B=lev(i+1),Cc=lev(i+2);
  if(!full){ctx.fillStyle=A.bg;ctx.fillRect(0,0,W,H);drawItems(A,T0,1,t)}
  if(R>.4){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(!full&&R>3){ // depth shading around the hole
      const g=ctx.createRadialGradient(p.x,p.y,R,p.x,p.y,R*1.7+10);g.addColorStop(0,'rgba(0,0,0,.34)');g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,R*1.7+10,0,Math.PI*2);ctx.fill();
    }
    ctx.save();
    if(!full){ctx.beginPath();ctx.arc(p.x,p.y,R,0,Math.PI*2);ctx.clip()}
    ctx.fillStyle=B.bg;ctx.fillRect(0,0,W,H);
    drawItems(B,T1,sm(.025,.2,T1.k),0);
    const q=B.portal;const qs={x:T1.k*q.x+T1.x,y:T1.k*q.y+T1.y};const R2=q.r*T1.k;
    if(R2>.4){
      ctx.setTransform(dpr,0,0,dpr,0,0);ctx.beginPath();ctx.arc(qs.x,qs.y,R2,0,Math.PI*2);ctx.clip();
      ctx.fillStyle=Cc.bg;ctx.fillRect(0,0,W,H);
      const T2=comp(T1,childT(B));drawItems(Cc,T2,sm(.025,.2,T2.k),0);
    }
    ctx.restore();
    if(!full){ // the rim of the lens you are falling through
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.globalAlpha=Math.min(1,R/6);ctx.strokeStyle=B.acc;ctx.lineWidth=Math.min(3,.8+R/80);
      ctx.beginPath();ctx.arc(p.x,p.y,R,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=Math.min(.5,R/30);ctx.strokeStyle=A.ink;ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(p.x,p.y,R+3+Math.min(10,R*.04),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
    }
  }
  if(!reduce)drawMotes(p,rate,full?B.ink:A.ink,dt);
}

/* ---------- state, motion ---------- */
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let z=0,zt=0,flight=null,lastInput=-1e9,lastDir=1,touching=false,started=false,interacted=false;
function cycleLog(){let s=0;for(let k=0;k<N;k++)s+=lev(k).logF;return s}
let CUM=[],CYC=0;
function computeLogs(){CUM=[];let s=0;for(let k=0;k<N;k++){CUM.push(s);s+=lev(k).logF}CYC=s}
function logMag(zz){const i=Math.floor(zz+1e-9),t=zz-i;return Math.floor(i/N)*CYC+CUM[((i%N)+N)%N]+t*lev(i).logF}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function fly(target,dur){
  target=Math.max(0,target);
  if(reduce){fade(()=>{z=zt=target});return}
  const d=Math.abs(target-z);if(d<1e-4){z=zt=target;flight=null;return}
  flight={from:z,to:target,t0:performance.now(),dur:dur||clamp(500+Math.pow(d,.75)*520,500,4200)};
}
function flyToLevel(j){

let fading=false;

  const i=Math.floor(z+1e-9),t=z-i,j=((i%N)+N)%N;
  const h=gauge.clientHeight;const y0=j/(N-1)*h,y1=j===N-1?h+h/(N-1):(j+1)/(N-1)*h;

/* ---------- loop ---------- */
let prevT=performance.now(),prevZ=0,raf=0;
function frame(ts){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-prevT)/1000);prevT=ts;now=ts;
  if(flight){const u=clamp((ts-flight.t0)/flight.dur,0,1);z=flight.from+(flight.to-flight.from)*ease(u);zt=z;if(u>=1){z=zt=flight.to;flight=null}}
  else{
    z+=(zt-z)*(1-Math.exp(-dt*11));if(Math.abs(zt-z)<1e-4)z=zt;
    if(!touching&&!reduce&&ts-lastInput>420&&Math.abs(zt-z)<.01){
      const i=Math.floor(z+1e-9),t=z-i;
      if(t>.002&&t<.998){const target=lastDir>0?(t>.1?i+1:i):(t<.9?i:i+1);fly(target,clamp(380+Math.abs(target-z)*900,380,1100))}
    }
  }
  const rate=dt>0?(z-prevZ)/dt*Math.log(lev(Math.floor(z+1e-9)).F):0;prevZ=z;
  render(rate,dt);hud();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else if(started&&!raf){prevT=performance.now();raf=requestAnimationFrame(frame)}});

const ptrs=new Map();let pinch0=0,down=null,vel=0,lastMoveT=0;

    const tnow=performance.now();const dtm=Math.max(8,tnow-lastMoveT);vel=vel*.6+(dz/dtm*1000)*.4;lastMoveT=tnow}

  if(ptrs.size===0){touching=false;
    if(down&&!down.moved&&performance.now()-down.t<500)tap(e.clientX,e.clientY);
    else if(down&&Math.abs(vel)>.3&&performance.now()-lastMoveT<120&&!reduce){nudge(clamp(vel*.22,-1.2,1.2))}
    down=null;lastInput=performance.now()}
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);

function hitTest(sx,sy){
  const f=frameTransforms(z);const {A,T0,T1,R,full}=f;const p=A.portal;
  const inHole=full||Math.hypot(sx-p.x,sy-p.y)<R;
  const tryS=(S,Tr,lvl)=>{const x=(sx-Tr.x)/Tr.k,y=(sy-Tr.y)/Tr.k;
    for(const h of S.hits){if(h.circle){if(Math.hypot(x-h.x,y-h.y)*Tr.k<Math.max(h.r*Tr.k,22))return{h,lvl}}
      else if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h&&h.w*Tr.k>14)return{h,lvl}}return null};
  if(inHole&&sm(.025,.2,T1.k)>.6)return tryS(lev(f.i+1),T1,f.i+1);
  if(!inHole)return tryS(A,T0,f.i);
  return null;
}
function tap(sx,sy){
  interacted=true;hint.classList.add('gone');
  const r=hitTest(sx,sy);if(!r){cv.focus({preventScroll:true});return}
  const {h,lvl}=r;
  if(h.act==='dive'){fly(lvl+1)}
  else if(h.act==='details'){if(Math.abs(z-lvl)>.02)fly(lvl);openPanel(((lvl%N)+N)%N)}
  else if(h.act==='ext'){const a=document.createElement('a');a.href=h.href;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
}
function hover(e){if(e.pointerType!=='mouse')return;const r=hitTest(e.clientX,e.clientY);cv.classList.toggle('hot',!!r)}
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeAll();return}
  if(anyOpen()&&idx.classList.contains('open'))return;
  if(e.target&&e.target.closest&&e.target.closest('#gauge button,#panel,a,button')&&(e.key===' '||e.key==='Enter'))return;
  const i=Math.round(z);
  switch(e.key){
    case'ArrowDown':case'ArrowRight':case'PageDown':case' ':e.preventDefault();interacted=true;hint.classList.add('gone');fly(Math.floor(z+1e-6)+1);break;
    case'ArrowUp':case'ArrowLeft':case'PageUp':e.preventDefault();fly(Math.max(0,Math.ceil(z-1e-6)-1));break;
    case'Home':e.preventDefault();fly(0);break;
    case'End':e.preventDefault();flyToLevel(N-1);break;
    case'+':case'=':nudge(.15);break;
    case'-':case'_':nudge(-.15);break;
    case'Enter':if(document.activeElement===cv||document.activeElement===document.body){openPanel(((i%N)+N)%N)}break;
  }
});
// gauge scrubbing (drag along the ruler)
let scrub=false;
gauge.addEventListener('pointerdown',e=>{scrub=true;gauge.setPointerCapture&&gauge.setPointerCapture(e.pointerId);scrubTo(e,false)});
gauge.addEventListener('pointermove',e=>{if(scrub)scrubTo(e,true)});
gauge.addEventListener('pointerup',()=>{scrub=false});gauge.addEventListener('pointercancel',()=>{scrub=false});
function scrubTo(e,moving){
  if(!moving)return; // a click goes to the button
  const r=gauge.getBoundingClientRect();const f=clamp((e.clientY-r.top)/r.height,0,1)*(N-1);
  const base=Math.floor(Math.round(z)/N)*N;flight=null;zt=base+f;lastInput=performance.now();lastDir=1;interacted=true;hint.classList.add('gone');
}

/* ---------- panels ---------- */
const panel=$('panel'),idx=$('index');
function closeAll(){panel.classList.remove('open');if(idx.classList.contains('open')){idx.classList.remove('open');$('indexBtn').focus()}}
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeAll));
function el(tag,txt,cls){const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function openPanel(j){
  const L=LEVELS[j];const body=$('pbody'),act=$('pact');body.innerHTML='';act.innerHTML='';
  const img=$('pimg'),fig=$('pfig');
  let src=null,alt='';
  $('ptitle').textContent=L.title;
  if(L.kind==='project'){const P=L.p;src='../img/'+P.id+'.webp';alt=P.title;
    $('peye').textContent='Plate '+pad(j+1)+' · '+P.craft+(P.date?' · '+fmtDate(P.date):'');
    if(P.line)body.appendChild(el('p',P.line));
    body.appendChild(el('p',DATA.crafts[P.craft],'eyebrow'));
    if(P.external){const a=el('a','Visit '+P.external.replace(/^https?:\/\//,'').replace(/\/$/,'')+' ↗','btn solid');a.href=P.external;a.target='_blank';a.rel='noopener';act.appendChild(a)}
  }else if(L.kind==='name'){src='../img/portrait.webp';alt='Portrait of Daniel Nadeem';$('peye').textContent='Plate 01 · '+DATA.site;
    body.appendChild(el('p',DATA.title+'.'));body.appendChild(el('p',DATA.lede));
  }else if(L.kind==='tesla'){const ex=DATA.experience[0];$('peye').textContent='Plate 02 · now';
    body.appendChild(el('p',DATA.title+'. Before that, '+ex.role+' in '+ex.where+', '+ex.when+'.'));
    const ul=el('ul');ex.did.forEach(d=>ul.appendChild(el('li',d)));body.appendChild(ul);
  }else if(L.kind==='else'){$('peye').textContent='Plate '+pad(j+1)+' · experience';
    DATA.experience.slice(1).forEach(e=>{body.appendChild(el('p',e.org+' — '+e.role+', '+e.where+' ('+e.when+')'));const ul=el('ul');e.did.forEach(d=>ul.appendChild(el('li',d)));body.appendChild(ul)});
  }else if(L.kind==='ubc'){$('peye').textContent='Plate '+pad(j+1)+' · education';
    body.appendChild(el('p',DATA.education));const c=el('div',null,'cols');DATA.courses.forEach(k=>{const d=el('div');d.appendChild(el('b',k.code));d.appendChild(document.createTextNode(k.title));c.appendChild(d)});body.appendChild(c);
  }else if(L.kind==='end'){$('peye').textContent='Plate '+pad(j+1)+' · links';
    body.appendChild(el('p','Skills: '+DATA.skills.join(', ')+'.'));body.appendChild(el('p',DATA.education+'.'));
    DATA.links.forEach(l=>{const a=el('a',l.label+' ↗','btn');a.href=l.href;a.target='_blank';a.rel='noopener';act.appendChild(a)});
  }
  if(src){img.src=src;img.alt=alt;fig.style.display=''}else{fig.style.display='none';img.removeAttribute('src')}
  const deeper=el('button','Fall further ↓','btn');deeper.type='button';deeper.addEventListener('click',()=>{closeAll();fly(Math.round(z)+1)});act.appendChild(deeper);
  panel.classList.add('open');panel.scrollTop=0;panel.querySelector('.x').focus({preventScroll:true});
}
$('indexBtn').addEventListener('click',()=>{panel.classList.remove('open');idx.classList.add('open');idx.scrollTop=0;idx.querySelector('.x').focus({preventScroll:true})});
(function buildIndex(){
  const ol=$('ilist');
  LEVELS.forEach((L,j)=>{const li=el('li');li.appendChild(el('span',pad(j+1),'n'));
    const b=el('button',L.title);b.type='button';b.addEventListener('click',()=>{closeAll();flyToLevel(j)});li.appendChild(b);
    let meta='',ln='';
    if(L.kind==='project'){meta=L.p.craft+(L.p.date?' · '+fmtDate(L.p.date):'');ln=L.p.line}
    else if(L.kind==='name'){meta='start';ln=DATA.title+'. '+DATA.lede}
    else if(L.kind==='tesla'){meta='now';ln=DATA.experience[0].role+', '+DATA.experience[0].when+': '+DATA.experience[0].did.join('; ')+'.'}
    else if(L.kind==='else'){meta='experience';ln=DATA.experience.slice(1).map(e=>e.org+', '+e.role).join(' · ')}
    else if(L.kind==='ubc'){meta='education';ln=DATA.education+'. '+DATA.courses.length+' courses.'}
    else if(L.kind==='end'){meta='links';ln=''}
    li.appendChild(el('span',meta,'meta'));
    const lnEl=el('div',ln,'ln');
    if(L.kind==='project'&&L.p.external){lnEl.appendChild(document.createTextNode(' '));const a=el('a',L.p.external.replace(/^https?:\/\//,'').replace(/\/$/,'')+' ↗');a.href=L.p.external;a.target='_blank';a.rel='noopener';lnEl.appendChild(a)}
    if(L.kind==='end'){DATA.links.forEach((l,k)=>{if(k)lnEl.appendChild(document.createTextNode(' · '));const a=el('a',l.label);a.href=l.href;a.target='_blank';a.rel='noopener';lnEl.appendChild(a)})}
    if(lnEl.textContent)li.appendChild(lnEl);
    ol.appendChild(li)});
})();

/* ---------- boot ---------- */
function resize(){
  W=window.innerWidth;H=window.innerHeight;phone=W<760;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  for(const k in cache)delete cache[k];computeLogs();placeGauge();
}
window.addEventListener('resize',()=>{resize()});
const lbar=$('lbar'),lrow=$('lrow');
function boot(){
  let fontsOk=false,imgsOk=false,go=false;
  const tryStart=()=>{if(go||!fontsOk)return;const need=['portrait',...ORDER.slice(0,5).filter(x=>x[0]!=='@')];if(!imgsOk&&!need.every(id=>IM[id]&&IM[id].complete))return;go=true;start()};
  loadImgs(()=>{lbar.style.width=(loaded/toLoad.length*100)+'%';lrow.textContent='Focusing — '+loaded+' / '+toLoad.length+' plates';tryStart()});
  const fl=document.fonts?Promise.all(['400 100px "Instrument Serif"','italic 400 100px "Instrument Serif"','400 16px "Instrument Sans"','600 16px "Instrument Sans"','500 16px "Instrument Sans"','400 12px "IBM Plex Mono"'].map(f=>document.fonts.load(f))):Promise.resolve();
  Promise.race([fl,new Promise(r=>setTimeout(r,3500))]).catch(()=>{}).then(()=>{fontsOk=true;tryStart()});
  setTimeout(()=>{imgsOk=true;tryStart()},4500);
}
function start(){
  resize();started=true;
  if(reduce)$('hinttxt').textContent=phone?'Swipe up to go one level deeper':'Scroll to go one level deeper';
  else $('hinttxt').textContent=phone?'Swipe up or pinch to fall in':'Scroll to fall in · click a title for details';
  $('loader').classList.add('done');setTimeout(()=>$('loader').remove(),1000);
  prevT=performance.now();raf=requestAnimationFrame(frame);cv.focus({preventScroll:true});
}
boot();
})();
</script>
