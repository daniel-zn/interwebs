<style>
:root{
  --paper:#f2efe7; --paper2:#e8e3d8; --ink:#23211d; --mute:#6c665b; --rule:#cfc7b6;

}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#161513;color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#gl.dragging{cursor:grabbing}
#gl.over{cursor:pointer}

/* plaque-style UI chrome */
.plaque{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 30px -12px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.3)}
.caps{font:500 10.5px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase}

#back{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:30;text-decoration:none;padding:9px 12px 8px;color:var(--ink)}
#back:hover{background:#fff}
#tools{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));z-index:30;display:flex;gap:6px}
#tools button{border:0;padding:9px 12px 8px}
#tools button:hover,#tools button[aria-pressed="true"]{background:#fff}
#tools button:focus-visible,#back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#caption{position:fixed;left:50%;top:max(22px,env(safe-area-inset-top));transform:translate(-50%,-6px);z-index:20;color:#f4efe4;text-align:center;pointer-events:none;opacity:0;transition:opacity .9s ease,transform .9s ease;text-shadow:0 1px 12px rgba(0,0,0,.55)}
#caption.on{opacity:1;transform:translate(-50%,0)}
#caption .k{font:500 10px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;opacity:.85}
#caption .t{font:500 26px/1.1 var(--serif);margin-top:6px}

#hint{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:20;color:#efe9dc;font:400 12px/1.5 var(--sans);letter-spacing:.02em;opacity:.85;transition:opacity 1.2s;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#hint b{font-weight:600}
#hint.gone{opacity:0}

#plan{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:20;padding:10px 10px 8px;transition:opacity .4s,transform .4s}
#plan .caps{display:flex;justify-content:space-between;gap:12px;margin:0 2px 7px;font-size:9.5px}
#plan .caps span:last-child{color:var(--mute)}
#plan canvas{display:block;width:232px;height:176px;cursor:pointer}
#plan .rooms{display:none}

#joy{position:fixed;left:max(22px,env(safe-area-inset-left));bottom:max(26px,calc(env(safe-area-inset-bottom) + 10px));width:112px;height:112px;border-radius:50%;z-index:21;display:none;touch-action:none;border:1px solid rgba(242,239,231,.55);background:radial-gradient(circle,rgba(22,21,19,.18),rgba(22,21,19,.38));transition:opacity .4s}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--paper);box-shadow:0 4px 14px rgba(0,0,0,.4)}
#joy span{position:absolute;left:0;right:0;top:-20px;text-align:center;color:#efe9dc;font:500 9px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* curator's label card */
#card{position:fixed;z-index:25;right:24px;top:50%;width:372px;max-height:calc(100% - 120px);overflow:auto;transform:translate(24px,-50%);opacity:0;pointer-events:none;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1);padding:26px 28px 22px;overscroll-behavior:contain}
#card.on{opacity:1;transform:translate(0,-50%);pointer-events:auto}
#card .no{display:flex;justify-content:space-between;color:var(--mute)}
#card h2{font:500 34px/1.02 var(--serif);margin:16px 0 8px;letter-spacing:-.005em}
#card .tomb{font:500 13px/1.4 var(--sans);margin:0 0 16px;color:var(--ink)}
#card .tomb em{font-style:normal;color:var(--mute);font-weight:400}
#card .cur{font:400 15px/1.55 var(--sans);margin:0 0 18px;padding-top:14px;border-top:1px solid var(--rule)}
#card .cur:empty{display:none}
#card .body{font:400 14px/1.55 var(--sans)}
#card .body h3{font:600 10.5px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;margin:18px 0 6px;color:var(--mute)}
#card .body p{margin:0 0 8px}
#card .body ul{margin:0 0 8px;padding-left:16px}
#card .body li{margin:0 0 4px}
#card figure{margin:0 0 4px;background:#d9d3c6}
#card figure img{display:block;width:100%;height:auto;max-height:240px;object-fit:contain;background:#1c1b19}
#card a.ext{display:inline-block;font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--paper);background:var(--ink);text-decoration:none;padding:11px 14px 10px;margin:0 0 18px}
#card a.ext:hover{background:var(--accent)}
#card a{color:var(--ink)}
#card nav{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--rule);padding-top:12px;margin-top:4px}
#card nav button,#card .x{border:0;background:none;padding:6px 2px}
#card nav button:hover,#card .x:hover{color:var(--accent)}
#card .x{position:absolute;right:14px;top:12px;font:400 22px/1 var(--sans);padding:4px 8px}
#card :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* floor guide (index) */
#guide{position:fixed;inset:0;z-index:40;background:rgba(18,17,15,.62);display:none}
#guide.on{display:block}
#guide .sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;padding:34px 38px 30px;overscroll-behavior:contain}
#guide header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
#guide h1{font:500 40px/1 var(--serif);margin:8px 0 0}
#guide .close{border:0;background:none;font:400 13px/1 var(--sans);padding:8px 0}
#guide .cols{columns:3 250px;column-gap:34px}
#guide section{break-inside:avoid;margin:0 0 24px}
#guide h2{font:600 10.5px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;margin:0 0 3px}
#guide h2+p{font:italic 500 16px/1.2 var(--serif);margin:0 0 10px;color:var(--mute)}
#guide ol{list-style:none;margin:0;padding:0}
#guide li button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:6px 0;border-bottom:1px solid var(--rule);font:400 14px/1.3 var(--sans)}
#guide li button span:first-child{color:var(--mute);font-variant-numeric:tabular-nums;min-width:22px}
#guide li button span:last-child{margin-left:auto;color:var(--mute);font-size:12px}
#guide li button:hover{color:var(--accent)}
#guide .about p,#guide .about li{font:400 13.5px/1.5 var(--sans);margin:0 0 6px}
#guide .about ul{padding:0;list-style:none;margin:0}
#guide .links a{color:var(--ink);margin-right:12px;font:500 13px/1.8 var(--sans)}
#guide :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#fade{position:fixed;inset:0;background:#171614;opacity:0;pointer-events:none;z-index:24;transition:opacity .3s ease}

/* entrance */
#intro{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(19,18,16,.58);transition:opacity 1.1s ease}
#intro.gone{opacity:0;pointer-events:none}
#intro .sheet{width:min(460px,calc(100% - 32px));padding:34px 36px 28px;text-align:left}
#intro .rule{height:1px;background:var(--ink);margin:14px 0 18px}
#intro h1{font:500 52px/.95 var(--serif);margin:12px 0 0;letter-spacing:-.01em}
#intro .sub{font:italic 500 21px/1.25 var(--serif);margin:8px 0 0;color:var(--mute)}
#intro p{font:400 14px/1.55 var(--sans);margin:0 0 14px}
#intro .rooms{font:500 11px/1.7 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:22px}
#intro .row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#enter{border:0;background:var(--ink);color:var(--paper);padding:14px 22px 13px;font:600 11.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase}
#enter:hover,#enter:focus-visible{background:var(--accent);outline:none}
#intro .alt{border:0;background:none;padding:0;font:400 13px/1 var(--sans);text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
#intro .load{font:400 11.5px/1.4 var(--sans);color:var(--mute);margin-top:18px}
#intro .keys{font:400 12px/1.6 var(--sans);color:var(--mute);margin-top:6px}

@media (max-width:720px){

  #card figure{display:none}
  #card h2{font-size:29px;margin-top:10px}

  #plan .caps{font-size:8.5px;margin-bottom:5px}
  #plan .caps span:last-child{display:none}
  body.carded #plan,body.carded #joy{opacity:0;pointer-events:none}
  #hint{display:none}
  #caption .t{font-size:22px}
  #guide .sheet{padding:24px 20px;top:0;left:0;transform:none;width:100%;max-height:100%;height:100%}
  #intro h1{font-size:44px}
}
@media (prefers-reduced-motion:reduce){
  #card,#caption,#intro,#fade{transition-duration:.01s}
}
</style>

/* ---------- canvas helpers ---------- */
function mk(w,h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctex(c, srgb = true){ const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso; return t; }
function wrap(x, text, px, py, maxW, lh, draw = true){
  const words = text.split(' '); let line = '', n = 0;
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (x.measureText(t).width > maxW && line){ if (draw) x.fillText(line, px, py); py += lh; line = w; n++; }
    else line = t;
  }
  if (line){ if (draw) x.fillText(line, px, py); py += lh; n++; }
  return py;
}
function tracked(x, text, px, py, track, align = 'left'){
  const chars = [...text]; let w = 0;
  const ws = chars.map(c => x.measureText(c).width);
  w = ws.reduce((a,b)=>a+b,0) + track*(chars.length-1);
  let cx = align === 'center' ? px - w/2 : align === 'right' ? px - w : px;
  const al = x.textAlign; x.textAlign = 'left';
  chars.forEach((c,i) => { x.fillText(c, cx, py); cx += ws[i] + track; });
  x.textAlign = al; return w;
}
function softRectTex(inset = 0.2, blur = 0.12){
  const S = 256, c = mk(S,S), x = c.getContext('2d');
  x.shadowColor = '#000'; x.shadowBlur = blur*S; x.shadowOffsetX = 4000;
  x.fillStyle = '#000'; x.fillRect(inset*S - 4000, inset*S, S*(1-2*inset), S*(1-2*inset));
  return ctex(c, false);
}
const tWash = (() => {
  const c = mk(256, 320), x = c.getContext('2d');
  x.save(); x.translate(128, 150); x.scale(1, 1.18);
  const g = x.createRadialGradient(0, 0, 0, 0, 0, 128);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.42, 'rgba(255,255,255,.72)');
  g.addColorStop(.78, 'rgba(255,255,255,.16)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.beginPath(); x.arc(0,0,128,0,7); x.fill(); x.restore();
  // a soft scalloped top edge, the way a ceiling spot cuts off
  x.globalCompositeOperation = 'destination-out';
  const g2 = x.createLinearGradient(0,0,0,70);
  g2.addColorStop(0,'rgba(0,0,0,1)'); g2.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle = g2; x.fillRect(0,0,256,70);
  return ctex(c, false);
})();
const tGlow = (() => {
  const c = mk(128,128), x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.5,'rgba(255,255,255,.35)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128); return ctex(c,false);
})();
const tDrop = softRectTex(0.22, 0.09);
const tContact = (() => {
  const c = mk(128,128), x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(0,0,0,.55)'); g.addColorStop(.6,'rgba(0,0,0,.25)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128); return ctex(c,false);
})();
const tWallGrad = (() => {
  const c = mk(4,256), x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#e4e4e4'); g.addColorStop(.35,'#fbfbfb'); g.addColorStop(.72,'#f6f6f6'); g.addColorStop(.97,'#d2d2d2'); g.addColorStop(1,'#c4c4c4');
  x.fillStyle = g; x.fillRect(0,0,4,256); return ctex(c);
})();
const tWood = (() => {
  const c = mk(512,256), x = c.getContext('2d');
  x.fillStyle = '#c9a479'; x.fillRect(0,0,512,256);
  for (let i = 0; i < 140; i++){
    const y = Math.random()*256, a = Math.random()*.16;
    x.strokeStyle = `rgba(${90+Math.random()*30|0},${55+Math.random()*20|0},30,${a})`;
    x.lineWidth = .6 + Math.random()*2.4;
    x.beginPath(); x.moveTo(0,y);
    for (let s = 0; s <= 512; s += 32) x.lineTo(s, y + Math.sin(s*.012 + i)*3 + Math.sin(s*.05+i*3)*1.2);
    x.stroke();
  }
  const t = ctex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
})();
const tConcreteWall = (() => {
  const c = mk(512,512), x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0,0,512,512);
  for (let i = 0; i < 2600; i++){ x.fillStyle = `rgba(0,0,0,${Math.random()*.05})`; x.fillRect(Math.random()*512, Math.random()*512, 1+Math.random()*3, 1+Math.random()*2); }
  for (let y = 0; y < 512; y += 64){ x.fillStyle = 'rgba(0,0,0,.07)'; x.fillRect(0,y,512,1.5); x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(0,y+2,512,1); }
  for (let i = 0; i < 18; i++){ x.fillStyle = 'rgba(0,0,0,.08)'; x.beginPath(); x.arc(Math.random()*512, (Math.floor(Math.random()*8)*64)+32, 3, 0, 7); x.fill(); }
  const t = ctex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
})();

function washMat(color, op){ return new THREE.MeshBasicMaterial({map:tWash, color:C(color), transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false}); }

function box(g, w,h,d, mat, x,y,z){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); g.add(m); return m; }
function cyl(g, r1,r2,h, mat, x,y,z, seg=24){ const m = new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg), mat); m.position.set(x,y,z); g.add(m); return m; }
function plane(w,h,mat){ return new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat); }

/* ---------- architecture ---------- */
const WALLS = [];       // raycast blockers
const PLANSEGS = [];    // for the floor plan
const roomMats = {};
function wallMat(room){
  if (roomMats[room.id]) return roomMats[room.id];
  const opts = {color:C(room.wall), map:tWallGrad};
  if (room.id === 'workshop'){ opts.map = tConcreteWall; }
  return roomMats[room.id] = new THREE.MeshLambertMaterial(opts);
}
function sideInfo(room, side){
  switch(side){
    case 'N': return {n:V3(0,0,1), at:u=>V3(u,0,room.z0), a:room.x0, b:room.x1};
    case 'S': return {n:V3(0,0,-1), at:u=>V3(u,0,room.z1), a:room.x0, b:room.x1};
    case 'W': return {n:V3(1,0,0), at:u=>V3(room.x0,0,u), a:room.z0, b:room.z1};
    case 'E': return {n:V3(-1,0,0), at:u=>V3(room.x1,0,u), a:room.z0, b:room.z1};
  }
}
function doorsOn(room, side){
  const e = 1e-3;
  return DOORS.filter(d =>
    side==='N' ? d.dir==='z' && Math.abs(d.z1-room.z0)<e && d.x0>=room.x0 && d.x1<=room.x1 :
    side==='S' ? d.dir==='z' && Math.abs(d.z0-room.z1)<e && d.x0>=room.x0 && d.x1<=room.x1 :
    side==='W' ? d.dir==='x' && Math.abs(d.x1-room.x0)<e && d.z0>=room.z0 && d.z1<=room.z1 :
                 d.dir==='x' && Math.abs(d.x0-room.x1)<e && d.z0>=room.z0 && d.z1<=room.z1
  ).map(d => d.dir==='z' ? [d.x0,d.x1] : [d.z0,d.z1]).sort((a,b)=>a[0]-b[0]);
}
function addWallPiece(room, side, a, b, y0, y1, mat){
  const si = sideInfo(room, side);
  const w = b - a, h = y1 - y0;
  const geo = new THREE.PlaneGeometry(w, h);
  // keep the gradient map continuous over the whole wall height
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++){ uv.setY(i, (y0 + uv.getY(i)*h)/room.h); }
  if (room.id === 'workshop'){ for (let i = 0; i < uv.count; i++){ uv.setX(i, uv.getX(i)*w/4); uv.setY(i, uv.getY(i)*room.h/4); } }
  const m = new THREE.Mesh(geo, mat || wallMat(room));
  const c = si.at((a+b)/2); c.y = (y0+y1)/2;
  m.position.copy(c); m.rotation.y = Math.atan2(si.n.x, si.n.z);
  scene.add(m); WALLS.push(m);
  if (y0 === 0){
    // shadow gap at the base of the wall
    const sg = plane(w, 0.03, MAT.gap); sg.position.copy(c).addScaledVector(si.n, 0.004); sg.position.y = 0.015; sg.rotation.y = m.rotation.y; scene.add(sg);
    const p0 = si.at(a), p1 = si.at(b); PLANSEGS.push([p0.x,p0.z,p1.x,p1.z]);
  }
  return m;
}
let nameWallMesh = null;
function buildRoom(room){
  for (const side of ['N','S','W','E']){
    const si = sideInfo(room, side);
    const gaps = doorsOn(room, side);
    let a = si.a;
    for (const [g0,g1] of gaps){
      if (g0 > a) addWallPiece(room, side, a, g0, 0, room.h, (room.id==='hall' && side==='N' && a===-6) ? 'NAME' : null);
      addWallPiece(room, side, g0, g1, DOOR_H, room.h);
      a = g1;
    }
    if (a < si.b){
      if (room.id==='hall' && side==='N' && a === -6){
        nameWallMesh = addWallPiece(room, side, a, 6, 0, room.h, nameWallMaterial());
        addWallPiece(room, side, 6, 8.5 > si.b ? si.b : 6, 0, room.h);
      } else addWallPiece(room, side, a, si.b, 0, room.h);
    }
  }
  buildCeiling(room);
}
// the hall north wall has 3 solid pieces; handle the centre (name) piece explicitly
function buildHall(room){
  const N = 'N';
  addWallPiece(room, N, -10, -8.5, 0, room.h);
  addWallPiece(room, N, -8.5, -6, DOOR_H, room.h);
  nameWallMesh = addWallPiece(room, N, -6, 6, 0, room.h, nameWallMaterial());
  addWallPiece(room, N, 6, 8.5, DOOR_H, room.h);
  addWallPiece(room, N, 8.5, 10, 0, room.h);
  for (const side of ['S','W','E']){
    const si = sideInfo(room, side); let a = si.a;
    for (const [g0,g1] of doorsOn(room, side)){ addWallPiece(room, side, a, g0, 0, room.h); addWallPiece(room, side, g0, g1, DOOR_H, room.h); a = g1; }
    addWallPiece(room, side, a, si.b, 0, room.h);
  }
  buildCeiling(room);
}
function buildDoor(d){
  const mat = new THREE.MeshLambertMaterial({color:C('#e4dfd5')});
  if (d.dir === 'x'){
    const L = d.x1 - d.x0, cx = (d.x0+d.x1)/2;
    const j1 = plane(L, DOOR_H, mat); j1.position.set(cx, DOOR_H/2, d.z0); scene.add(j1);
    const j2 = plane(L, DOOR_H, mat); j2.position.set(cx, DOOR_H/2, d.z1); j2.rotation.y = Math.PI; scene.add(j2);
    const s = plane(L, d.z1-d.z0, mat); s.position.set(cx, DOOR_H, (d.z0+d.z1)/2); s.rotation.x = Math.PI/2; scene.add(s);
  } else {
    const L = d.z1 - d.z0, cz = (d.z0+d.z1)/2;
    const j1 = plane(L, DOOR_H, mat); j1.position.set(d.x0, DOOR_H/2, cz); j1.rotation.y = Math.PI/2; scene.add(j1);
    const j2 = plane(L, DOOR_H, mat); j2.position.set(d.x1, DOOR_H/2, cz); j2.rotation.y = -Math.PI/2; scene.add(j2);
    const s = plane(d.x1-d.x0, L, mat); s.position.set((d.x0+d.x1)/2, DOOR_H, cz); s.rotation.x = Math.PI/2; scene.add(s);

}
function buildCeiling(room){
  const ceilCol = room.id==='games' ? '#2e3430' : room.id==='workshop' ? '#b9b4aa' : '#efebe3';
  const mat = new THREE.MeshLambertMaterial({color:C(ceilCol)});
  const holes = SKY[room.id] || [];
  const [hx0,hx1,hz0,hz1] = holes[0];
  const y = room.h;
  const rect = (x0,x1,z0,z1) => { if (x1-x0<=0 || z1-z0<=0) return; const p = plane(x1-x0, z1-z0, mat); p.rotation.x = Math.PI/2; p.position.set((x0+x1)/2, y, (z0+z1)/2); scene.add(p); };
  rect(room.x0, room.x1, room.z0, hz0); rect(room.x0, room.x1, hz1, room.z1);
  rect(room.x0, hx0, hz0, hz1); rect(hx1, room.x1, hz0, hz1);
  // light well
  const D = 1.1, wellMat = new THREE.MeshBasicMaterial({color:C('#efe7da').multiplyScalar(1.05)});
  const wellMat2 = new THREE.MeshBasicMaterial({color:C('#d9d0c2')});
  const w = hx1-hx0, d = hz1-hz0;
  const a = plane(w, D, wellMat); a.position.set((hx0+hx1)/2, y+D/2, hz0); scene.add(a);
  const b = plane(w, D, wellMat); b.position.set((hx0+hx1)/2, y+D/2, hz1); b.rotation.y = Math.PI; scene.add(b);
  const c = plane(d, D, wellMat2); c.position.set(hx0, y+D/2, (hz0+hz1)/2); c.rotation.y = Math.PI/2; scene.add(c);
  const e = plane(d, D, wellMat2); e.position.set(hx1, y+D/2, (hz0+hz1)/2); e.rotation.y = -Math.PI/2; scene.add(e);
  const glass = plane(w, d, MAT.glowW); glass.rotation.x = Math.PI/2; glass.position.set((hx0+hx1)/2, y+D, (hz0+hz1)/2); scene.add(glass);
  // mullions
  const mm = new THREE.MeshLambertMaterial({color:C('#3b3a37')});
  const step = 1.25;
  for (let x = hx0 + step; x < hx1 - .2; x += step) box(scene, .03, .08, d, mm, x, y+D-.05, (hz0+hz1)/2);
  for (let z = hz0 + step; z < hz1 - .2; z += step) box(scene, w, .08, .03, mm, (hx0+hx1)/2, y+D-.05, z);
  // workshop: exposed concrete beams
  if (room.id === 'workshop'){
    const bm = new THREE.MeshLambertMaterial({color:C('#b3aea4')});
    for (let z = room.z0 + 2.7; z < room.z1 - 1; z += 3.6) box(scene, room.x1-room.x0, .55, .32, bm, 0, y-.275, z);
  }
}

/* ---------- name wall (cut letters) ---------- */
function nameWallMaterial(){
  const W = 2048, H = Math.round(2048*7/12), k = W/12;
  const c = mk(W,H), x = c.getContext('2d');
  x.fillStyle = RM.hall.wall; x.fillRect(0,0,W,H);
  x.globalCompositeOperation = 'multiply'; x.drawImage(tWallGrad.image, 0, 0, W, H); x.globalCompositeOperation = 'source-over';
  // plaster grain
  for (let i = 0; i < 9000; i++){ x.fillStyle = `rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},${Math.random()<.5?0:255},.018)`; x.fillRect(Math.random()*W, Math.random()*H, 2, 2); }
  const text = DATA.name.toUpperCase();
  let fs = 220; x.font = `600 ${fs}px ${SERIF}`;
  const tr = () => fs*0.12;
  const measure = () => [...text].reduce((s,ch)=>s+x.measureText(ch).width,0) + tr()*(text.length-1);
  const target = W*0.86; fs = fs*target/measure(); x.font = `600 ${fs}px ${SERIF}`;
  const base = (7-4.55)*k + fs*0.33;
  const draw = (ctx, dx, dy) => { ctx.font = `600 ${fs}px ${SERIF}`; tracked(ctx, text, W/2+dx, base+dy, tr(), 'center'); };
  const band = (shift, color, alpha) => {
    const s = mk(W,H), sx = s.getContext('2d');
    sx.fillStyle = '#000'; sx.fillRect(0,0,W,H);
    sx.globalCompositeOperation = 'destination-out'; sx.fillStyle = '#000'; draw(sx, shift[0], shift[1]);
    sx.globalCompositeOperation = 'destination-in'; draw(sx, 0, 0);
    sx.globalCompositeOperation = 'source-in'; sx.fillStyle = color; sx.fillRect(0,0,W,H);
    x.globalAlpha = alpha; x.drawImage(s,0,0); x.globalAlpha = alpha*.5; x.drawImage(s,0,1.5); x.drawImage(s,1,0); x.globalAlpha = 1;
  };
  x.fillStyle = 'rgba(70,56,42,.34)'; draw(x,0,0);                      // floor of the cut
  band([0, .06*k], 'rgb(30,24,18)', .8);                               // shadow under the top lip
  band([.02*k, 0], 'rgb(40,32,24)', .16);                               // left side wall
  band([0, -.035*k], 'rgb(255,252,244)', .7);                           // lit bottom bevel
  const t = ctex(c);
  return new THREE.MeshLambertMaterial({map:t});
}

/* ---------- text panels ---------- */
function textPanel(wM, hM, draw, ppm = 460){
  let pw = Math.round(wM*ppm), ph = Math.round(hM*ppm);
  const s = Math.min(1, 2048/pw, 2048/ph); pw = Math.round(pw*s); ph = Math.round(ph*s);
  const c = mk(pw, ph), x = c.getContext('2d'); const k = pw/wM;
  draw(x, k, pw, ph);
  const m = plane(wM, hM, new THREE.MeshLambertMaterial({map:ctex(c), transparent:true, depthWrite:false}));
  m.renderOrder = 2; return m;
}
function onWall(obj, room, side, u, y, off = 0.006){
  const si = sideInfo(room, side);
  const p = si.at(u); p.y = y; p.addScaledVector(si.n, off);
  obj.position.copy(p); obj.rotation.y = Math.atan2(si.n.x, si.n.z); scene.add(obj); return obj;
}
const PICK = [];   // {mesh, kind:'work'|'text', ref}
function pickProxy(obj, w, h, d, ref, kind, local){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshBasicMaterial());
  m.visible = false; if (local) m.position.copy(local); obj.add(m);
  m.userData.pick = {kind, ref}; PICK.push(m); return m;
}
function sign(room, side, u, y, gal, title, sub, w = 4.4){
  const ink = room.ink;
  const p = textPanel(w, 1.5, (x,k,W,H) => {
    x.fillStyle = ink; x.textAlign = 'center';
    x.font = `500 ${.085*k}px ${SANS}`; tracked(x, gal.toUpperCase(), W/2, .24*k, .03*k, 'center');
    x.font = `500 ${.52*k}px ${SERIF}`; x.fillText(title, W/2, .82*k);
    x.font = `italic 500 ${.17*k}px ${SERIF}`; x.fillText(sub, W/2, 1.12*k);
    x.fillRect(W/2 - .25*k, .36*k, .5*k, Math.max(1,.006*k));
  }, 300);
  return onWall(p, room, side, u, y);
}
function textBlock(room, side, u, y, w, h, key, drawFn){
  const p = textPanel(w, h, (x,k,W,H) => { x.fillStyle = room.ink; drawFn(x,k,W,H); });
  onWall(p, room, side, u, y);
  if (key){ const g = new THREE.Group(); g.position.copy(p.position); g.rotation.copy(p.rotation); scene.add(g); pickProxy(g, w, h, .1, key, 'text'); }
  return p;
}

const FRAME_STYLE = {

function fitSize(a, maxW, maxH){ return a > maxW/maxH ? [maxW, maxW/a] : [maxH*a, maxH]; }
function frameGroup(texSrc, aspect, st, cy, hero){
  const g = new THREE.Group();
  let [w,h] = fitSize(aspect, st.maxW*(hero?1.35:1), st.maxH*(hero?1.35:1));
  const W = w + 2*st.mat + 2*st.fb, H = h + 2*st.mat + 2*st.fb, d = st.d;
  const sh = plane(W+.16, H+.2, shadowMat); sh.position.set(.0, cy-.07, .003); g.add(sh);
  const wash = plane(W+2.0, H+2.3, washMat(st.wash, st.washOp)); wash.position.set(0, cy+.18, .002); wash.renderOrder = 1; g.add(wash);
  box(g, W, st.fb, d, st.frame, 0, cy + H/2 - st.fb/2, d/2);
  box(g, W, st.fb, d, st.frame, 0, cy - H/2 + st.fb/2, d/2);
  box(g, st.fb, H - 2*st.fb, d, st.frame, -W/2 + st.fb/2, cy, d/2);
  box(g, st.fb, H - 2*st.fb, d, st.frame, W/2 - st.fb/2, cy, d/2);
  const back = plane(W - 2*st.fb, H - 2*st.fb, st.mat ? MAT.matte : MAT.black); back.position.set(0, cy, d - .022); g.add(back);
  const img = plane(w, h, new THREE.MeshBasicMaterial({map: imgTex(texSrc), color: new THREE.Color(1.0,1.0,1.0)}));

}

function addLabel(g, w, x, y, z = .004){
  const l = plane(LABEL_W, LABEL_H, new THREE.MeshLambertMaterial({map:labelTexture(w)}));
  l.position.set(x, y, z); g.add(l);

function buildFrameWork(w){
  const room = RM[w.room], si = sideInfo(room, w.side);
  const st = FRAME_STYLE[w.p.craft === 'cooking' ? 'cooking' : w.p.craft];
  const hero = w.room === 'games' && w.side === 'E';
  const cy = hero ? 1.75 : 1.58;

  pickProxy(g, f.W + .2, f.H + .2, .16, w.i, 'work', V3(0, cy, .08));
  pickProxy(g, LABEL_W + .1, LABEL_H + .1, .1, w.i, 'work', V3(lx, 1.3, .05));
  const p = si.at(w.u); g.position.copy(p); g.rotation.y = Math.atan2(si.n.x, si.n.z); scene.add(g);
  g.updateMatrixWorld(true);
  w.group = g; w.n = si.n.clone();
  w.look = g.localToWorld(V3(f.W*.18, cy - .04, 0));
  w.fitW = f.W + 1.2; w.fitH = f.H + .5;

}

const EYE = 1.62, R = .34;
function inRect(x,z,a,b,c,d){ return x>a && x<b && z>c && z<d; }
function canStand(x,z){
  let ok = false;
  for (const r of ROOMS) if (inRect(x,z,r.x0+R,r.x1-R,r.z0+R,r.z1-R)){ ok = true; break; }
  if (!ok) for (const d of DOORS){
    if (d.dir==='x' ? inRect(x,z,d.x0-R-.02,d.x1+R+.02,d.z0+R,d.z1-R) : inRect(x,z,d.x0+R,d.x1-R,d.z0-R-.02,d.z1+R+.02)){ ok = true; break; }
  }
  if (!ok) return false;
  for (const o of OBST) if (inRect(x,z,o[0]-R*.8,o[1]+R*.8,o[2]-R*.8,o[3]+R*.8)) return false;
  return true;
}
function roomAt(x,z){ for (const r of ROOMS) if (inRect(x,z,r.x0,r.x1,r.z0,r.z1)) return r; return null; }

const S = { x:0, z:8.6, yaw:0, pitch:.06, bob:0, moving:0 };

}
function angDiff(a,b){ let d = b - a; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; return d; }
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

function startGlide(x, z, yaw, pitch, dur, done){

}
let fading = false;
function teleport(x, z, yaw, pitch, done){

  setTimeout(() => {

function effAspect(open){
  const W = innerWidth, H = innerHeight;
  if (!open) return W/H;
  return W > 720 ? (W - 420)/H : W/(H*0.5);
}
function standFor(w, open){
  const vf = THREE.MathUtils.degToRad(camera.fov);
  const hf = 2*Math.atan(Math.tan(vf/2)*effAspect(open));
  let d = Math.max(w.fitH/(2*Math.tan(vf/2)), w.fitW/(2*Math.tan(hf/2)));
  d = Math.min(Math.max(d, w.standMin || 2.1), 6.2);
  const room = RM[w.room];
  const span = Math.abs(w.n.x) > .5 ? room.x1 - room.x0 : room.z1 - room.z0;
  d = Math.min(d, span - 1.2);
  const sx = w.look.x + w.n.x*d, sz = w.look.z + w.n.z*d;
  const yaw = Math.atan2(-(w.look.x - sx), -(w.look.z - sz));

}
function focusWork(i, fromKeyboard){

  const here = roomAt(S.x, S.z);

  else {
    const dist = Math.hypot(st.x - S.x, st.z - S.z);

function focusText(key, fromKeyboard){

  const [u, side, y] = map[key];
  const si = sideInfo(hall, side), p = si.at(u); p.y = y;
  const d = key === 'portrait' ? 3.4 : 3.9;
  const x = p.x + si.n.x*d, z = p.z + si.n.z*d;
  const yaw = Math.atan2(-(p.x - x), -(p.z - z));
  const go = () => openCard({kind:'text', key}, fromKeyboard);
  const here = roomAt(S.x, S.z);
  if (reduce || !here || here.id !== 'hall') teleport(x, z, yaw, Math.atan2(y-EYE, d), go);

// the name/lede block opens the portrait card; lede block is keyed 'portrait'
function walkTo(px, pz){
  const dx = px - S.x, dz = pz - S.z, dist = Math.hypot(dx, dz);

  // stop short of anything in the way

  for (let i = 1; i <= n; i++){ const x = S.x + dx*i/n, z = S.z + dz*i/n; if (!canStand(x,z)) break; tx = x; tz = z; }

  startGlide(tx, tz, yaw, Math.min(S.pitch, .05)*.5, Math.hypot(tx-S.x, tz-S.z)/2.0 + .35);
}

let AC = null, master, dry, wet, noiseBuf, muted = false;
function initAudio(){
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
    dry = AC.createGain(); dry.gain.value = .8; dry.connect(master);
    const conv = AC.createConvolver();
    const len = AC.sampleRate*2.6, ir = AC.createBuffer(2, len, AC.sampleRate);
    for (let ch = 0; ch < 2; ch++){ const d = ir.getChannelData(ch); for (let i = 0; i < len; i++){ const t = i/len; d[i] = (Math.random()*2-1)*Math.pow(1-t, 3.4)*(i < 900 ? i/900 : 1); } }
    conv.buffer = ir; wet = AC.createGain(); wet.gain.value = .32; conv.connect(wet); wet.connect(master);
    dry.connect(conv);
    noiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
    const nd = noiseBuf.getChannelData(0); let last = 0;
    for (let i = 0; i < nd.length; i++){ nd[i] = Math.random()*2-1; }
    // room tone: very quiet brown noise, low-passed
    const bb = AC.createBuffer(1, AC.sampleRate*4, AC.sampleRate), bd = bb.getChannelData(0);
    for (let i = 0; i < bd.length; i++){ last = (last + .02*(Math.random()*2-1))/1.02; bd[i] = last*3.2; }
    const tone = AC.createBufferSource(); tone.buffer = bb; tone.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
    const tg = AC.createGain(); tg.gain.value = .05; tone.connect(lp); lp.connect(tg); tg.connect(master); tone.start();
    $('bSound').textContent = 'Sound on'; $('bSound').setAttribute('aria-pressed','true');
  } catch (e) { AC = null; }
}
function footstep(){
  if (!AC || muted) return;
  const t = AC.currentTime + .005, room = roomAt(S.x, S.z);
  wet.gain.setTargetAtTime(room && room.id==='hall' ? .42 : room && room.id==='kitchen' ? .18 : .3, t, .3);
  // heel
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500 + Math.random()*900; bp.Q.value = 1.1;
  const g = AC.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16 + Math.random()*.05, t + .003); g.gain.exponentialRampToValueAtTime(.0008, t + .075);
  s.connect(bp); bp.connect(g); g.connect(dry); s.start(t, Math.random()*1.5, .1);
  // body
  const o = AC.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(52, t + .09);
  const og = AC.createGain(); og.gain.setValueAtTime(0, t); og.gain.linearRampToValueAtTime(.22, t + .004); og.gain.exponentialRampToValueAtTime(.0008, t + .12);
  o.connect(og); og.connect(dry); o.start(t); o.stop(t + .14);
  // toe scuff
  const s2 = AC.createBufferSource(); s2.buffer = noiseBuf;
  const lp = AC.createBiquadFilter(); lp.type = 'bandpass'; lp.frequency.value = 3200; lp.Q.value = .6;
  const g2 = AC.createGain(); const t2 = t + .075 + Math.random()*.02;
  g2.gain.setValueAtTime(0, t2); g2.gain.linearRampToValueAtTime(.035, t2 + .012); g2.gain.exponentialRampToValueAtTime(.0005, t2 + .07);
  s2.connect(lp); lp.connect(g2); g2.connect(dry); s2.start(t2, Math.random()*1.5, .1);
}
$('bSound').onclick = () => {
  if (!AC){ initAudio(); muted = false; return; }
  muted = !muted; master.gain.setTargetAtTime(muted ? 0 : .9, AC.currentTime, .05);
  $('bSound').textContent = muted ? 'Sound off' : 'Sound on'; $('bSound').setAttribute('aria-pressed', String(!muted));
};

const cv = $('gl');
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

function pick(cx, cy){

  camera.updateMatrixWorld(); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(RAYSET, false);
  for (const h of hits){
    if (h.object.userData.pick) return {pick:h.object.userData.pick, point:h.point};
    if (h.object === floor) return {floor:h.point};

  }

let drag = null, joyId = null; const joy = {x:0, y:0};
cv.addEventListener('pointerdown', e => {

const PC = $('planc'), px = PC.getContext('2d');

}

  const r = PC.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio||1);

}

function drawPlan(){

  }
  for (const d of DOORS){ px.fillStyle = '#e6e0d3'; px.fillRect(T.X(d.x0), T.Z(d.z0), (d.x1-d.x0)*T.sc, (d.z1-d.z0)*T.sc); }
  px.strokeStyle = '#23211d'; px.lineWidth = 1.8*u; px.lineCap = 'square';
  px.beginPath(); for (const [a,b,c,d] of PLANSEGS){ px.moveTo(T.X(a), T.Z(b)); px.lineTo(T.X(c), T.Z(d)); } px.stroke();
  // works
  px.fillStyle = '#9c3b22';
  for (const w of WORKS){ const p = w.group.position; const q = w.kind === 'plinth' ? w.group.localToWorld(V3(0,0,1.45)) : p.clone().addScaledVector(w.n, .5);
    px.fillRect(T.X(q.x) - 1.2*u, T.Z(q.z) - 1.2*u, 2.4*u, 2.4*u); }
  px.fillStyle = '#6c665b'; px.font = `600 ${7*u}px ${SANS}`; px.textAlign = 'center';
  const lab = {hall:'HALL', apps:'APPS', games:'GAMES', workshop:'WORKSHOP', kitchen:'KITCHEN'};
  for (const r of ROOMS){ px.fillText(lab[r.id], T.X((r.x0+r.x1)/2), T.Z(r.id==='hall' ? r.z0 + 3.6 : (r.z0+r.z1)/2 + (r.id==='workshop'?-5.5:r.id==='kitchen'?3.5:3.2)) ); }
  // visitor
  const vx = T.X(S.x), vz = T.Z(S.z), a = -S.yaw - Math.PI/2;
  px.fillStyle = 'rgba(156,59,34,.22)'; px.beginPath(); px.moveTo(vx, vz);
  px.arc(vx, vz, 22*u, a - .5, a + .5); px.closePath(); px.fill();
  px.fillStyle = '#9c3b22'; px.beginPath(); px.arc(vx, vz, 3.4*u, 0, 7); px.fill();
  px.strokeStyle = '#f2efe7'; px.lineWidth = 1.2*u; px.stroke();
}
PC.addEventListener('click', e => {
  if (!entered) enter();
  const r = PC.getBoundingClientRect(), T = planXf();
  const X = (e.clientX - r.left)*PC.width/r.width, Y = (e.clientY - r.top)*PC.height/r.height;
  const wx = T.ix(X), wz = T.iz(Y);
  let room = roomAt(wx, wz);
  if (!room){ let bd = 1e9; for (const rr of ROOMS){ const cx = Math.max(rr.x0, Math.min(rr.x1, wx)), cz = Math.max(rr.z0, Math.min(rr.z1, wz)); const d = Math.hypot(cx-wx, cz-wz); if (d < bd){ bd = d; room = rr; } } if (bd > 4) return; }
  closeCard();
  const [x, z, yaw] = room.entry;
  teleport(x, z, yaw, room.id==='hall' ? .1 : .02);
});

/* ---------- room caption ---------- */
let capTimer = 0;
function checkRoom(force){
  const r = roomAt(S.x, S.z);
  if (!r || (r === lastRoom && !force)) return;
  if (r === lastRoom) return;
  lastRoom = r;
  if (!entered) return;
  $('caption').querySelector('.k').textContent = r.k;
  $('caption').querySelector('.t').textContent = r.id === 'hall' ? 'Entrance Hall' : r.id === 'workshop' ? 'The Workshop' : r.id === 'kitchen' ? 'The Kitchen' : r.name;
  $('caption').classList.add('on'); clearTimeout(capTimer);
  capTimer = setTimeout(() => $('caption').classList.remove('on'), 2800);
}

/* ---------- resize ---------- */
let rtScale = touch ? .4 : .5;
function resize(){
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W/H; camera.fov = W/H < .8 ? 68 : W/H < 1.2 ? 62 : 55;
  camera.updateProjectionMatrix();
  const rw = Math.max(256, Math.round(W*DPR*rtScale)), rh = Math.max(256, Math.round(H*DPR*rtScale));
  rt.setSize(rw, rh); floorMat.uniforms.texel.value.set(1/rw, 1/rh);
  sizePlan(); setShift(); dirty = 3;
}
addEventListener('resize', resize);

/* ---------- loop ---------- */
let stepAcc = 0, last = performance.now(), running = true;
function update(dt){
  let moved = false;
  const px0 = S.x, pz0 = S.z;
  if (glide){
    glide.t += dt/glide.dur; const t = Math.min(1, glide.t), e = ease(t);
    S.x = glide.x0 + (glide.x - glide.x0)*e; S.z = glide.z0 + (glide.z - glide.z0)*e;
    S.yaw = glide.y0 + glide.dy*e; S.pitch = glide.p0 + (glide.pitch - glide.p0)*e;
    moved = true;
    if (t >= 1){ const d = glide.done; glide = null; if (d) d(); }
  } else {
    let f = 0, s = 0, turn = 0;
    if (keys.has('w') || keys.has('arrowup')) f += 1;
    if (keys.has('s') || keys.has('arrowdown')) f -= 1;
    if (keys.has('d')) s += 1; if (keys.has('a')) s -= 1;
    if (keys.has('arrowleft') || keys.has('q')) turn += 1;
    if (keys.has('arrowright') || keys.has('e')) turn -= 1;
    f += -joy.y; s += joy.x;
    if (turn){ S.yaw += turn*1.7*dt; moved = true; }
    const m = Math.hypot(f, s);
    if (m > .05){
      if (cardOpen) closeCard();
      const sp = (keys.has('shift') ? 3.6 : 2.0) * Math.min(1, m);
      f /= Math.max(1, m); s /= Math.max(1, m);
      const fx = -Math.sin(S.yaw), fz = -Math.cos(S.yaw), rx = Math.cos(S.yaw), rz = -Math.sin(S.yaw);
      const dx = (fx*f + rx*s)*sp*dt, dz = (fz*f + rz*s)*sp*dt;
      if (canStand(S.x+dx, S.z+dz)){ S.x += dx; S.z += dz; }
      else if (canStand(S.x+dx, S.z)) S.x += dx;
      else if (canStand(S.x, S.z+dz)) S.z += dz;
      moved = true;
    }
  }
  const dist = Math.hypot(S.x - px0, S.z - pz0);
  S.moving += ((dist/dt > .3 ? 1 : 0) - S.moving)*Math.min(1, dt*6);
  if (dist > 0){ S.bob += dist*4.1; stepAcc += dist; if (stepAcc > .74){ stepAcc = 0; footstep(); } }
  if (moved || S.moving > .01) dirty = 3;
  // view offset animates the work into the space beside the label
  const ox = shift.x, oy = shift.y;
  shift.x += (shift.tx - shift.x)*Math.min(1, dt*(reduce?30:4)); shift.y += (shift.ty - shift.y)*Math.min(1, dt*(reduce?30:4));
  if (Math.abs(shift.x - shift.tx) < .5) shift.x = shift.tx; if (Math.abs(shift.y - shift.ty) < .5) shift.y = shift.ty;
  if (ox !== shift.x || oy !== shift.y){
    if (shift.x || shift.y) camera.setViewOffset(innerWidth, innerHeight, shift.x, shift.y, innerWidth, innerHeight); else camera.clearViewOffset();
    dirty = 3;
  }
  checkRoom();
}
let hoverT = 0;
function frame(now){
  if (!running) return;
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last)/1000); last = now;
  update(dt);
  hoverT += dt;
  if (hoverAt && hoverT > .08 && !drag){ hoverT = 0; const h = pick(hoverAt[0], hoverAt[1]); cv.classList.toggle('over', !!(h && h.pick)); hoverAt = null; }
  if (dirty > 0){
    applyCamera();
    renderReflection();
    renderer.render(scene, camera);
    drawPlan();
    dirty--;
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ running = false; if (AC) AC.suspend(); }
  else { running = true; last = performance.now(); dirty = 3; if (AC && !muted) AC.resume(); requestAnimationFrame(frame); }
});

resize();
applyCamera();
updateLoad();
requestAnimationFrame(frame);
window.__museum = {S, WORKS, focusWork, enter, teleport};
})();
</script>
