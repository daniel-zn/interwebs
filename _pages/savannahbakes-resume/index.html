<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savannah Bakes · Résumé</title>
<meta name="description" content="Savannah Bakes: résumé examples.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="preload" href="fonts/orbix-regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Styled after danielzn.com/resume: near-black, bone type, one sun-orange accent, Orbix throughout. */
@font-face { font-family: 'Orbix'; src: url('fonts/orbix-regular.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
@font-face { font-family: 'Orbix Fill'; src: url('fonts/orbitron-v35-latin.woff2') format('woff2'); font-weight: 400; font-display: swap; size-adjust: 92%; }
:root {
  --bg: #0a0a0b; --bg-2: #111112; --bg-3: #18181a;
  --fg: #e9e6df; --dim: #aaa59c; --faint: #6f6b65;
  --line: rgba(233, 230, 223, 0.12); --line-2: rgba(233, 230, 223, 0.24);
  --sun: #ff5b2e;
  --font: 'Orbix', 'Orbix Fill', ui-sans-serif, system-ui, sans-serif;
  --gutter: clamp(1rem, 3.4vw, 2.1rem);
  --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100svh; font-size: .95rem; line-height: 1.75; letter-spacing: .01em; background: var(--bg); -webkit-font-smoothing: antialiased; overflow-x: clip; }
a { color: inherit; text-decoration: none; }
h1, h2 { font-weight: 400; margin: 0; line-height: 1.05; letter-spacing: -.01em; }
.wrap { width: 100%; max-width: 78rem; margin: 0 auto; padding: calc(clamp(3rem, 9vw, 6rem) + env(safe-area-inset-top)) max(var(--gutter), env(safe-area-inset-right)) calc(4rem + env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left)); }
.label { font-size: .66rem; line-height: 1.5; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.label--hue { color: var(--sun); }
.pip { display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: var(--sun); margin-right: .7em; vertical-align: .06em; }

header h1 { font-size: clamp(3rem, 9vw, 7rem); line-height: .92; letter-spacing: -.03em; margin: 1rem 0 .9rem; }
.sub { color: var(--sun); font-size: clamp(1rem, 2vw, 1.3rem); margin: 0; }
.links { display: flex; flex-wrap: wrap; gap: .6rem 1.8rem; list-style: none; margin: 2rem 0 0; padding: 0; }
.links a { transition: color .2s ease; }

.list { list-style: none; margin: clamp(2.5rem, 6vw, 4rem) 0 0; padding: 1.6rem 0 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: 2rem 1.4rem; }
.card { display: grid; gap: .9rem; }
.shot { position: relative; display: block; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 6px; background: var(--bg-3); }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease), filter .4s ease; filter: saturate(.85); }
.shot::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .3s ease; }
.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.card h2 { font-size: 1.2rem; transition: color .2s ease; }
.card:focus-visible { outline: 1px solid var(--sun); outline-offset: 6px; border-radius: 6px; }
.card.pending { opacity: .45; }
.card.pending .shot { display: grid; place-items: center; }

footer { margin-top: clamp(3rem, 8vw, 5rem); padding-top: 1.6rem; border-top: 1px solid var(--line); }

@media (hover: hover) {
  .links a:hover { color: var(--sun); }
  a.card:hover .shot img { transform: scale(1.04); filter: saturate(1); }
  a.card:hover .shot::after { box-shadow: inset 0 0 0 1px var(--sun), 0 0 40px -6px rgba(255, 91, 46, .5); }
  a.card:hover h2 { color: var(--sun); }
}
@media (prefers-reduced-motion: reduce) { .shot img, .card h2 { transition: none; } }
</style>
<script>window.READY = ["swiss-grid","feature","two-inks","chronology","contours","specimen","colour-fields","letterpress"];</script>
</head>
<body>
<main class="wrap">
  <header>
    <p class="label label--hue"><span class="pip" aria-hidden="true"></span>Résumé</p>
    <h1>Savannah Bakes</h1>
    <p class="sub">Resume Examples</p>
    <ul class="links label">
      <li><a href="mailto:savannahpbakes@gmail.com">savannahpbakes@gmail.com</a></li>
      <li><a href="https://www.linkedin.com/in/savannah-bakes" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      <li><a href="Savannah-Bakes-Resume.pdf" download>Résumé PDF ↓</a></li>
    </ul>
  </header>

  <ol class="list" id="list"></ol>

  <footer><a class="label" href="/">interwebs</a></footer>
</main>
<script>
const versions = [['Living Matter', 'living-matter'], ['Swiss Grid', 'swiss-grid'], ['Feature', 'feature'], ['Two Inks', 'two-inks'], ['Chronology', 'chronology'], ['Contours', 'contours'], ['Specimen', 'specimen'], ['Colour Fields', 'colour-fields'], ['Letterpress', 'letterpress']];
const READY = window.READY || versions.map(([, slug]) => slug);
const list = document.getElementById('list');
versions.forEach(([name, slug], i) => {
  const n = i + 1, ready = READY.includes(slug), num = String(n).padStart(2, '0');
  const li = document.createElement('li');
  li.innerHTML = ready
    ? `<a class="card" href="${slug}/"><span class="shot"><img src="${slug}/cover.webp" alt="" width="640" height="400" loading="${i < 4 ? 'eager' : 'lazy'}"></span>
        <span class="meta"><h2>${name}</h2><span class="label">${num}</span></span></a>`
    : `<div class="card pending"><span class="shot"><span class="label">In progress</span></span>
        <span class="meta"><h2>${name}</h2><span class="label">${num}</span></span></div>`;
  list.appendChild(li);
});
</script>
</body>
</html>
