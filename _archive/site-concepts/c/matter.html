<style>
:root{
  --bg:#0b0b0a; --bg2:#121210; --ink:#ece7dc; --ink2:#c9c3b6; --dim:#8a8478; --faint:#2c2a26;
  --line:rgba(236,231,220,.13); --acc:#ff5a1f;
  --disp:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif;
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);scroll-snap-type:y mandatory;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);overflow-x:hidden;
  background-image:radial-gradient(rgba(236,231,220,.055) 1px, transparent 1.2px);background-size:28px 28px;background-attachment:fixed}
a{color:inherit}
button{font:inherit;color:inherit}
::selection{background:var(--acc);color:#140a05}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:pan-y}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(120% 90% at 60% 45%, transparent 55%, rgba(5,5,4,.55) 100%)}
main{position:relative;z-index:2}
.s{position:relative;min-height:100vh;min-height:100svh;scroll-snap-align:start;display:flex;align-items:center;padding:96px 0 96px}
.panel{width:min(35vw,470px);margin-left:clamp(24px,5.2vw,88px);position:relative}
.js .s .panel{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.2,.7,.1,1),transform .9s cubic-bezier(.2,.7,.1,1)}
.js .s.on .panel{opacity:1;transform:none}
.meta{font:500 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;gap:.8em;flex-wrap:wrap;margin:0 0 18px}
.meta .no{color:var(--acc)}
.meta .craft{color:var(--ink2)}
h1,h2{font-family:var(--disp);font-weight:700;font-stretch:112%;letter-spacing:-.03em;line-height:.95;margin:0}
h2{font-size:clamp(36px,4.1vw,66px)}
h1{font-size:clamp(40px,4.4vw,68px)}
.line{font:italic 400 clamp(19px,1.55vw,24px)/1.35 var(--serif);color:var(--ink);margin:18px 0 0;max-width:30ch;text-wrap:pretty}
.lede{font:400 clamp(18px,1.4vw,21px)/1.45 var(--serif);color:var(--ink2);margin:18px 0 0;max-width:34ch}
.row{display:flex;gap:18px;align-items:flex-start;margin-top:26px}
.spec{margin:0;flex:0 0 auto;width:132px}
.spec img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--line);filter:saturate(.9)}
.spec figcaption{font:400 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:7px}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font:400 12px/1.4 var(--mono);align-content:start}
.facts div{display:contents}
.facts dt{color:var(--dim);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;padding-top:1px}
.facts dd{margin:0;color:var(--ink)}
.ext{display:inline-flex;align-items:center;gap:.6em;margin-top:24px;font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  text-decoration:none;color:var(--bg);background:var(--ink);padding:12px 16px 11px;border-radius:2px;transition:background .2s}
.ext:hover,.ext:focus-visible{background:var(--acc)}
.hint{font:400 11px/1.6 var(--mono);color:var(--dim);letter-spacing:.06em;margin-top:26px}
.hint b{font-weight:500;color:var(--ink2)}
.intro{align-items:flex-end}
.intro .panel{width:min(44vw,560px)}
.about .panel{width:min(40vw,520px)}
.about h3{font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:28px 0 10px}
.xp{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.xp li{font:400 15px/1.4 var(--serif);color:var(--ink2)}
.xp b{font-family:var(--disp);font-weight:600;color:var(--ink);font-size:15.5px;letter-spacing:-.01em}
.xp span{font:400 11px var(--mono);color:var(--dim);letter-spacing:.04em}
.links{display:flex;flex-wrap:wrap;gap:8px 18px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.links a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:4px}
.links a:hover,.links a:focus-visible{color:var(--acc);border-color:var(--acc)}
.small{font:400 12px/1.6 var(--mono);color:var(--dim)}

/* HUD */
.hud{position:fixed;z-index:5;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.back{top:max(18px,env(safe-area-inset-top));left:clamp(16px,2vw,28px);text-decoration:none;color:var(--dim);padding:6px 0}
.back:hover,.back:focus-visible{color:var(--ink)}
.idxbtn{top:max(12px,env(safe-area-inset-top));right:clamp(16px,2vw,28px);background:none;border:1px solid var(--line);padding:10px 14px 9px;cursor:pointer;border-radius:2px;display:flex;gap:10px;align-items:center}
.idxbtn:hover,.idxbtn:focus-visible{border-color:var(--ink);color:var(--ink)}
.idxbtn i{display:inline-grid;gap:3px}
.idxbtn i::before,.idxbtn i::after{content:"";display:block;width:14px;height:1px;background:currentColor}
.counter{bottom:max(18px,env(safe-area-inset-bottom));left:clamp(16px,2vw,28px);color:var(--dim);display:flex;gap:12px;align-items:baseline;max-width:44vw;white-space:nowrap;overflow:hidden}
.counter .n{color:var(--ink)}
.counter .f{overflow:hidden;text-overflow:ellipsis}
.field{bottom:max(12px,env(safe-area-inset-bottom));right:clamp(16px,2vw,28px);display:flex;align-items:center;gap:12px}
.field .lbl{color:var(--dim)}
.seg{display:flex;border:1px solid var(--line);border-radius:2px}
.seg button{background:none;border:0;padding:9px 11px 8px;cursor:pointer;color:var(--dim);font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{color:var(--bg);background:var(--ink)}
.seg button:hover{color:var(--ink)}.seg button[aria-pressed=true]:hover{color:var(--bg)}
.rail{position:fixed;z-index:4;right:clamp(16px,2vw,28px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:0;list-style:none;margin:0;padding:0}
.rail li.gap{height:10px}
.rail button{display:block;background:none;border:0;padding:3px 0;cursor:pointer;width:26px;position:relative}
.rail button::before{content:"";display:block;margin-left:auto;width:8px;height:1px;background:var(--dim);transition:width .3s,background .3s}
.rail button:hover::before{width:16px;background:var(--ink)}
.rail button.on::before{width:24px;background:var(--acc)}
.rail button::after{content:attr(data-t);position:absolute;right:34px;top:50%;transform:translateY(-50%);white-space:nowrap;font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .2s;background:var(--bg);padding:4px 6px}
.rail button:hover::after,.rail button:focus-visible::after{opacity:1}
.readout{position:fixed;z-index:4;right:clamp(16px,2vw,28px);top:72px;font:400 10px/1.6 var(--mono);letter-spacing:.08em;color:var(--dim);text-align:right;text-transform:uppercase;pointer-events:none}
.readout b{color:var(--ink2);font-weight:500}

#index{position:fixed;inset:0;z-index:20;background:rgba(11,11,10,.97);overflow:auto;padding:84px clamp(16px,5vw,88px) 60px;display:none}
#index.open{display:block}
#index header{display:flex;justify-content:space-between;align-items:baseline;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:28px}
#index h2{font-size:clamp(34px,4vw,56px)}
#index .close{background:none;border:1px solid var(--line);color:var(--ink);font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:10px 14px 9px;cursor:pointer;border-radius:2px}
#index .close:hover{border-color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:34px 40px}
.cols h3{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:0 0 6px}
.cols p{font:italic 400 15px/1.3 var(--serif);color:var(--dim);margin:0 0 12px}
.cols ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.cols li{border-bottom:1px solid var(--line)}
.cols a{display:flex;justify-content:space-between;gap:12px;padding:10px 0 9px;text-decoration:none;font:500 17px/1.2 var(--disp);letter-spacing:-.01em}
.cols a span{font:400 11px/1.6 var(--mono);color:var(--dim);flex:0 0 auto}
.cols a:hover,.cols a:focus-visible{color:var(--acc)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.scrim{display:none}
:focus-visible{outline:1px solid var(--acc);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

.nogl #gl,.nogl .readout,.nogl .field{display:none}
.nogl .spec{width:min(100%,420px)}
.nogl .row{flex-direction:column}

@media (max-width:760px){
  .s{align-items:flex-end;padding:0 0 calc(70px + env(safe-area-inset-bottom))}
  .panel,.intro .panel,.about .panel{width:auto;margin:0 16px}
  .meta{margin-bottom:10px;font-size:10px}
  h2{font-size:clamp(28px,8.4vw,40px)}
  h1{font-size:34px}
  .line{font-size:17.5px;margin-top:10px}
  .lede{font-size:16.5px;margin-top:10px}
  .row{margin-top:14px;gap:14px}
  .spec{width:84px}
  .ext{margin-top:14px;padding:11px 14px 10px}
  .hint{margin-top:14px}
  .scrim{display:block;position:fixed;left:0;right:0;bottom:0;height:52%;z-index:1;pointer-events:none;
    background:linear-gradient(to bottom, rgba(11,11,10,0), rgba(11,11,10,.78) 38%, rgba(11,11,10,.92))}
  .rail,.readout{display:none}
  .counter{display:none}
  .field{left:16px;right:16px;justify-content:space-between}
  .about{padding-top:48vh}
  .about .panel{padding-bottom:10px}
  .nogl .s{padding-top:72px}
}
@media (prefers-reduced-motion:reduce){
  .js .s .panel{transition:none;transform:none}
}
</style>

  const z=new Uint8Array(NP*4);
  [tA,tB,cA,cB]=[0,0,0,0].map(()=>{const t=mkTex();gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,S,S,0,gl.RGBA,gl.UNSIGNED_BYTE,z);return t;});
  if(SIM){
    for(let k=0;k<2;k++){
      pos[k]=mkTex(); gl.texImage2D(gl.TEXTURE_2D,0,simFmt.ifmt,S,S,0,gl.RGBA,simFmt.type,null);
      vel[k]=mkTex(); gl.texImage2D(gl.TEXTURE_2D,0,simFmt.ifmt,S,S,0,gl.RGBA,simFmt.type,null);
      fbPos[k]=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fbPos[k]); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,pos[k],0);
      fbVel[k]=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fbVel[k]); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,vel[k],0);
      gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbPos[0]); gl.viewport(0,0,S,S);
    gl.useProgram(P_init.p); setU(P_init,{uRes:S,uView:[W/2,H/2]}); drawQuad(P_init);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  }
  // dust
  const rnd=mulberry(7);
  dustMask=new Uint8Array(NP); for(let i=0;i<NP;i++) dustMask[i]=rnd()<0.06?1:0;
  dustXY=new Float32Array(NP*2); seedDust();
}
function seedDust(){const rnd=mulberry(11);for(let i=0;i<NP;i++){dustXY[i*2]=(rnd()-0.5)*W*1.1;dustXY[i*2+1]=(rnd()-0.5)*H*1.1;}}
function drawQuad(pr){const l=gl.getAttribLocation(pr.p,'p');gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,6);gl.disableVertexAttribArray(l);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- form generation ---------- */
const FAM='"Archivo", "Helvetica Neue", Arial, sans-serif';
const cv=document.createElement('canvas'); const cx=cv.getContext('2d',{willReadFrequently:true});
function rectFrac(x0,y0,x1,y1){return {x:x0*W,y:y0*H,w:(x1-x0)*W,h:(y1-y0)*H};}
function layout(kind){
  const m=W<=760;
  if(kind==='name') return m?rectFrac(.05,.10,.95,.50):rectFrac(.05,.08,.95,.57);
  if(kind==='about') return m?rectFrac(.12,.07,.88,.44):rectFrac(.50,.10,.93,.90);
  return m?rectFrac(.05,.085,.95,.49):rectFrac(.42,.12,.92,.86);
}
function wrap(words,n){
  if(n===1) return [words.join(' ')];
  const widths=words.map(w=>cx.measureText(w+' ').width), tot=widths.reduce((a,b)=>a+b,0), target=tot/n;
  const lines=[]; let cur=[],acc=0;
  words.forEach((w,i)=>{ if(cur.length&&acc+widths[i]/2>target&&lines.length<n-1){lines.push(cur.join(' '));cur=[];acc=0;} cur.push(w);acc+=widths[i]; });
  lines.push(cur.join(' ')); return lines;
}
function fitText(text,r,weight,maxPx,maxLines){
  const words=text.split(/\s+/);
  cx.font=`${weight} 100px ${FAM}`; try{cx.fontStretch='semi-expanded';}catch(e){}
  let best=null;
  for(let n=1;n<=Math.min(maxLines,words.length);n++){
    const lines=wrap(words,n);
    const mw=Math.max(...lines.map(l=>cx.measureText(l).width));
    const size=Math.min(r.w*100/mw, r.h/(lines.length*0.95), maxPx);
    if(!best||size>best.size*1.04) best={size,lines};
  }
  return best;
}
function encode(posA,colA,i,x,y,r,g,b,a){
  const ux=Math.max(0,Math.min(65535,Math.round((x+4096)/8192*65535))), uy=Math.max(0,Math.min(65535,Math.round((y+4096)/8192*65535)));
  const o=i*4; posA[o]=ux>>8;posA[o+1]=ux&255;posA[o+2]=uy>>8;posA[o+3]=uy&255;
  colA[o]=r;colA[o+1]=g;colA[o+2]=b;colA[o+3]=a;
}
function putDust(P,Cc,i,rnd){
  const v=110+rnd()*60; encode(P,Cc,i,dustXY[i*2],dustXY[i*2+1],v,v*0.96,v*0.9,0);
}
function textForm(text,kind,opts){
  const r=layout(kind);
  cv.width=Math.ceil(W);cv.height=Math.ceil(H);
  cx.clearRect(0,0,cv.width,cv.height);
  const f=fitText(text,r,opts.weight||700,opts.max||(W<=760?120:220),opts.lines||4);
  cx.font=`${opts.weight||700} ${f.size}px ${FAM}`; try{cx.fontStretch='semi-expanded';}catch(e){} cx.fillStyle='#fff'; cx.textBaseline='alphabetic';
  cx.textAlign=opts.align||'center';
  const lh=f.size*0.95, blockH=lh*f.lines.length;
  const asc=f.size*0.74;
  const y0=r.y+(r.h-blockH)/2;
  f.lines.forEach((l,k)=>{const x=opts.align==='left'?r.x:r.x+r.w/2; cx.fillText(l,x,y0+k*lh+lh/2+f.size*0.36);});
  const d=cx.getImageData(0,0,cv.width,cv.height).data;
  const pts=[]; for(let i=0,n=cv.width*cv.height;i<n;i++) if(d[i*4+3]>110) pts.push(i);
  const P=new Uint8Array(NP*4),Cc=new Uint8Array(NP*4), rnd=mulberry(text.length*131+7);
  const cw=cv.width; let nact=0;
  const ink=opts.ink||[236,231,220];
  for(let i=0;i<NP;i++){
    if(dustMask[i]||!pts.length){putDust(P,Cc,i,rnd);continue;}
    const q=pts[(rnd()*pts.length)|0];
    const px=(q%cw)+rnd(), py=Math.floor(q/cw)+rnd();
    const spark=rnd()<0.025, v=0.9+rnd()*0.1;
    const col=spark?[255,110,48]:[ink[0]*v,ink[1]*v,ink[2]*v];
    encode(P,Cc,i,px-W/2,H/2-py,col[0],col[1],col[2],128+((rnd()-0.5)*40|0));
    nact++;
  }
  const spacing=Math.sqrt(pts.length/Math.max(1,nact));
  return {P,C:Cc,size:Math.max(1.3,Math.min(3.2,spacing*2.1+0.6))};
}
function imageForm(img,kind){
  const r=layout(kind);
  const ar=img.naturalWidth/img.naturalHeight;
  let w=r.w,h=r.w/ar; if(h>r.h){h=r.h;w=h*ar;}
  const ox=r.x+(r.w-w)/2, oy=r.y+(r.h-h)/2;
  const iw=Math.max(2,Math.round(w)), ih=Math.max(2,Math.round(h));
  cv.width=iw;cv.height=ih; cx.clearRect(0,0,iw,ih); cx.drawImage(img,0,0,iw,ih);
  const d=cx.getImageData(0,0,iw,ih).data; // may throw if tainted
  const P=new Uint8Array(NP*4),Cc=new Uint8Array(NP*4), rnd=mulberry(iw*31+ih);
  let nact=0; for(let i=0;i<NP;i++) if(!dustMask[i]) nact++;
  const cols=Math.max(1,Math.round(Math.sqrt(nact*w/h))), rows=Math.ceil(nact/cols);
  const cw=w/cols, chh=h/rows, edge=Math.min(28,Math.min(w,h)*0.06);
  let j=0;
  for(let i=0;i<NP;i++){
    if(dustMask[i]){putDust(P,Cc,i,rnd);continue;}
    let x=((j%cols)+rnd())*cw, y=(Math.floor(j/cols)+rnd())*chh; j++;
    if(y>h) y=rnd()*h;
    const sx=Math.min(iw-1,Math.max(0,x|0)), sy=Math.min(ih-1,Math.max(0,y|0)), o=(sy*iw+sx)*4;
    let R=d[o],G=d[o+1],Bc=d[o+2];
    const lum=(0.2126*R+0.7152*G+0.0722*Bc)/255;
    // frayed edge: some particles near the border drift outward
    const ed=Math.min(x,w-x,y,h-y);
    if(ed<edge && rnd()<Math.pow(1-ed/edge,1.6)*0.7){
      const nx=x<w/2?-1:1, ny=y<h/2?-1:1, push=rnd()*edge*1.4;
      if(Math.min(x,w-x)<Math.min(y,h-y)) x+=nx*push; else y+=ny*push;
    }
    encode(P,Cc,i,ox+x-W/2,H/2-(oy+y),R,G,Bc,Math.max(1,Math.min(255,Math.round(128+(lum-0.45)*170))));
  }
  const spacing=Math.sqrt(w*h/nact);
  return {P,C:Cc,size:Math.max(1.6,Math.min(4.5,spacing*1.9))};
}

/* images: real file first; if the sandbox taints the canvas, fall back to embedded proxies */
let tainted=null; const imgCache={};
const taintTest=new Promise(res=>{
  const im=new Image(); im.decoding='async';
  im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=2;const x=c.getContext('2d');x.drawImage(im,0,0,2,2);x.getImageData(0,0,1,1);tainted=false;}catch(e){tainted=true;}res();};
  im.onerror=()=>{tainted=true;res();};
  im.src='../img/portrait.webp';
  setTimeout(()=>{if(tainted===null){tainted=true;res();}},5000);
});
function loadImg(id){
  if(imgCache[id]) return imgCache[id];
  return imgCache[id]=taintTest.then(()=>new Promise(res=>{
    const im=new Image(); im.decoding='async';
    im.onload=()=>res(im);
    im.onerror=()=>{ if(im.src.indexOf('data:')!==0&&EMB[id]){im.src=EMB[id];} else res(null); };
    im.src=tainted?EMB[id]:'../img/'+id+'.webp';
  }));
}

let wantKey=null, curKey=null, reqTok=0;
const formCache=new Map();
function getCached(k){const v=formCache.get(k);if(v){formCache.delete(k);formCache.set(k,v);}return v;}
function putCache(k,v){formCache.set(k,v); while(formCache.size>6) formCache.delete(formCache.keys().next().value);}
async function buildForm(key){
  const c=getCached(key); if(c) return c;
  let f=null;
  if(key==='name') f=textForm(C.name,'name',{weight:800,max:W<=760?140:300,lines:2});
  else if(key==='hello') f=textForm('Hello.','about',{weight:800,max:W<=760?120:260,lines:1});
  else if(key.startsWith('title:')){const p=C.projects.find(q=>q.id===key.slice(6)); f=textForm(p.title,'proj',{weight:700,lines:4});}
  else if(key.startsWith('img:')){
    const id=key.slice(4), im=await loadImg(id); if(!im) return null;
    const kind=id==='portrait'?'about':'proj';
    try{ f=imageForm(im,kind); }
    catch(e){ tainted=true; delete imgCache[id]; const im2=await loadImg(id); if(!im2) return null; try{f=imageForm(im2,kind);}catch(e2){return null;} }
  }
  if(f) putCache(key,f);
  return f;
}
async function requestForm(key){
  if(!GLOK) return;
  wantKey=key; const tok=++reqTok;
  const f=await buildForm(key);
  if(tok!==reqTok||!f) return;
  swapIn(f,key);
}
let interpFrozen=false;
function swapIn(f,key){
  // previous destination becomes the origin
  [tA,tB]=[tB,tA]; [cA,cB]=[cB,cA]; sizeA=sizeB; sizeB=f.size;
  gl.bindTexture(gl.TEXTURE_2D,tB); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,S,S,0,gl.RGBA,gl.UNSIGNED_BYTE,f.P);
  gl.bindTexture(gl.TEXTURE_2D,cB); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,S,S,0,gl.RGBA,gl.UNSIGNED_BYTE,f.C);
  if(!curKey){ // first form: origin = same
    gl.bindTexture(gl.TEXTURE_2D,tA); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,S,S,0,gl.RGBA,gl.UNSIGNED_BYTE,f.P);
    gl.bindTexture(gl.TEXTURE_2D,cA); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,S,S,0,gl.RGBA,gl.UNSIGNED_BYTE,f.C);
    sizeA=f.size;
  }
  curKey=key; morphT0=time;
  if(RM) drawStill();
}

/* ---------- pointer ---------- */
const mouse={x:0,y:0,tx:0,ty:0,vx:0,vy:0,on:0,ton:0,last:0};
let shock=[0,0,-99];
function setPointer(cxp,cyp){
  const x=cxp-W/2, y=H/2-cyp, t=performance.now();
  const dt=Math.max(8,t-mouse.last)/1000;
  if(mouse.last&&t-mouse.last<120){mouse.vx=mouse.vx*0.6+((x-mouse.tx)/dt)*0.4;mouse.vy=mouse.vy*0.6+((y-mouse.ty)/dt)*0.4;}
  mouse.tx=x;mouse.ty=y;mouse.last=t;mouse.ton=1;
  if(!mouse.on){mouse.x=x;mouse.y=y;}
}
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.pointerType==='pen')setPointer(e.clientX,e.clientY);},{passive:true});
document.addEventListener('mouseleave',()=>{mouse.ton=0;});
addEventListener('touchstart',e=>{const t=e.touches[0];if(t){mouse.last=0;setPointer(t.clientX,t.clientY);mouse.x=mouse.tx;mouse.y=mouse.ty;}},{passive:true});
addEventListener('touchmove',e=>{const t=e.touches[0];if(t)setPointer(t.clientX,t.clientY);},{passive:true});
addEventListener('touchend',()=>{mouse.ton=0;},{passive:true});
document.addEventListener('click',e=>{
  if(e.target.closest('a,button,#index,[role=dialog]')) return;
  if(!GLOK||RM) return;
  shock=[e.clientX-W/2,H/2-e.clientY,time];
},{passive:true});

/* ---------- loop ---------- */
let time=0,last=0,raf=0,yaw=0,pitch=0,swv=0;
const ACC=[1.0,0.36,0.12];
function scale(){return Math.max(0.42,Math.min(1.15,Math.min(W,H)/880));}
function common(pr){
  setS(pr,{uTA:2,uTB:3,uCA:4,uCB:5});
  setU(pr,{uT:time-morphT0,uSpread:RM?0:0.75,uFly:RM?0.001:1.15,uHalfW:W/2,uZR:RM?20:70});
}
function bindTargets(){tex(2,tA);tex(3,tB);tex(4,cA);tex(5,cB);}
function renderPoints(pr,extra){
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(pr.p); bindTargets(); common(pr);
  setU(pr,Object.assign({uView:[W/2,H/2],uYaw:yaw,uPitch:pitch,uDpr:DPR,uSizeA:sizeA,uSizeB:sizeB,uAcc:ACC},extra));
  const l=gl.getAttribLocation(pr.p,'aRef'); gl.bindBuffer(gl.ARRAY_BUFFER,refBuf);
  gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.POINTS,0,NP); gl.disableVertexAttribArray(l);
  gl.disable(gl.BLEND);
}
let si=0;
function step(dt){
  const sc=scale();
  const fields={uRes:S,uTime:time,uDt:dt,uMouse:[mouse.x,mouse.y],uMouseV:[mouse.vx,mouse.vy],uMouseOn:mouse.on,uMode:mode,
    uRad:(coarse?95:130)*sc,uIdle:28,uScale:sc,uScrollV:swv,uShock:shock};
  gl.viewport(0,0,S,S);
  // velocity
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbVel[1-si]);
  gl.useProgram(P_vel.p); tex(0,pos[si]);tex(1,vel[si]); bindTargets();
  setS(P_vel,{uPos:0,uVel:1}); common(P_vel); setU(P_vel,fields); drawQuad(P_vel);
  // position
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbPos[1-si]);
  gl.useProgram(P_pos.p); tex(0,pos[si]);tex(1,vel[1-si]);
  setS(P_pos,{uPos:0,uVel:1}); setU(P_pos,{uRes:S,uDt:dt}); drawQuad(P_pos);
  si=1-si;
}
function frame(t){
  raf=requestAnimationFrame(frame);
  const dt=last?Math.min(0.05,(t-last)/1000):1/60; last=t; time+=dt;
  mouse.on+=(mouse.ton-mouse.on)*Math.min(1,dt*(mouse.ton?10:2.5));
  mouse.x+=(mouse.tx-mouse.x)*Math.min(1,dt*22); mouse.y+=(mouse.ty-mouse.y)*Math.min(1,dt*22);
  mouse.vx*=Math.pow(0.02,dt); mouse.vy*=Math.pow(0.02,dt);
  const ty=coarse?Math.sin(time*0.3)*0.05:(mouse.tx/W)*0.16, tp=coarse?Math.sin(time*0.23)*0.03:-(mouse.ty/H)*0.10;
  yaw+=(ty-yaw)*Math.min(1,dt*3); pitch+=(tp-pitch)*Math.min(1,dt*3);
  // scroll velocity → upward wind
  const sv=scrollV/Math.max(dt,0.008); scrollV=0;
  swv+=(Math.max(-6000,Math.min(6000,sv))*0.9-swv)*Math.min(1,dt*8);
  if(SIM){
    const n=dt>0.026?2:1; for(let k=0;k<n;k++) step(Math.min(dt/n,1/45));
    tex(0,pos[si]);tex(1,vel[si]); gl.useProgram(P_rsim.p); setS(P_rsim,{uPos:0,uVel:1});
    renderPoints(P_rsim,{});
  } else {
    renderPoints(P_rint,{uTime:time,uMouse:[mouse.x,mouse.y],uMouseV:[mouse.vx,mouse.vy],uMouseOn:mouse.on,uMode:mode,
      uRad:(coarse?95:130)*scale(),uIdle:100,uScale:scale(),uShock:shock});
  }
}
function drawStill(){
  yaw=0.0;pitch=0.0; time=morphT0+100;
  renderPoints(P_rint,{uTime:0,uMouse:[0,0],uMouseV:[0,0],uMouseOn:0,uMode:0,uRad:100,uIdle:0,uScale:scale(),uShock:[0,0,-99]});
}
function sizeCanvas(){
  W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
}
function start(){ if(!raf&&!RM&&GLOK&&!document.hidden){last=0;raf=requestAnimationFrame(frame);} }
function stop(){ cancelAnimationFrame(raf); raf=0; }
document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});
let rsT=0,lastW=W,lastH=H;
addEventListener('resize',()=>{
  clearTimeout(rsT); rsT=setTimeout(()=>{
    const wc=innerWidth!==lastW, hc=Math.abs(innerHeight-lastH)>lastH*0.15;
    sizeCanvas();
    if(!GLOK) return;
    if(wc||hc){ lastW=W;lastH=H; formCache.clear(); seedDust(); const k=wantKey; curKey=curKey&&'x'; wantKey=null; if(k) requestForm(k); }
    else if(RM) drawStill();
  },180);
});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();stop();GLOK=false;doc.classList.add('nogl');});

/* ---------- boot ---------- */
sizeCanvas();
setupGL();
updateReadout();
const fontsReady=(document.fonts&&document.fonts.load)?Promise.all([
  document.fonts.load(`800 200px "Archivo"`),document.fonts.load(`700 200px "Archivo"`)
]).catch(()=>{}):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).then(()=>{
  const i=currentIndex(); active=-1; activate(i);
  start();
});
// show the first panel immediately even before fonts arrive
sections[currentIndex()].classList.add('on');
})();
</script>
</body>
