const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

/* ---------- markup helpers ---------- */
function ht(id,x,y,w,h,o,st,label){
  o=o||{};
  const p=PR[id];
  const lab=label||(p?p.title:'Daniel Nadeem');
  return `<canvas class="a ht" role="img" aria-label="${esc(lab)} (photo)" data-id="${id}" data-w="${w}" data-h="${h}" data-o='${JSON.stringify(o)}' style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${st||''}"></canvas>`;
}
function torn(j,n){
  j=j||1.4;n=n||12;const r=()=>(rnd()*j).toFixed(2),q=i=>(i/n*100).toFixed(1);const p=[];
  for(let i=0;i<=n;i++)p.push(`${q(i)}% ${r()}%`);
  for(let i=0;i<=n;i++)p.push(`${(100-rnd()*j).toFixed(2)}% ${q(i)}%`);
  for(let i=n;i>=0;i--)p.push(`${q(i)}% ${(100-rnd()*j).toFixed(2)}%`);
  for(let i=n;i>=0;i--)p.push(`${r()}% ${q(i)}%`);
  return `clip-path:polygon(${p.join(',')});`;
}
const tape=(x,y,r,w)=>`<i class="tape" style="left:${x}px;top:${y}px;width:${w||86}px;transform:rotate(${r}deg)"></i>`;
function tix(p,x,y,r){
  if(!p.external)return'';
  return `<a class="a tix" href="${p.external}" target="_blank" rel="noopener" style="left:${x}px;top:${y}px;transform:rotate(${r||0}deg)"><b>PLAY IT ↗</b><span>${host(p.external)}</span></a>`;
}

function dot(x,y,k,r){
  const c=KC[k];let h='';
  c.forEach((ink,i)=>{h+=`<i class="a m" style="left:${x-r+i*1.6}px;top:${y-r-i*1.2}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:${INK[ink]}"></i>`});
  return h;
}
function tlPanel(j){
  const x0=j*500;let h='';
  // giant years for the busy years
  const BIG={2020:1,2021:1,2022:1,2026:1};
  TLI.forEach(it=>{if(it.newYr&&BIG[it.yr]){const x=it.x-x0-8;if(x>-260&&x<520)
    h+=`<div class="a D" style="left:${x}px;top:8px;font-size:104px;font-stretch:56%;color:transparent;-webkit-text-stroke:1.6px var(--P);opacity:.95">${it.yr}</div>`}});
  const bl=j===0?248:0;
  h+=`<div class="a fT m" style="left:${bl}px;top:397px;width:${500-bl}px;height:7px"></div>`;
  TLI.forEach((it,i)=>{
    const x=it.x-x0;if(x<-50||x>550)return;
    const up=i%2===0;
    h+=`<i class="a fT m" style="left:${x-.75}px;top:${up?372:404}px;width:1.5px;height:25px"></i>`;
    h+=dot(x,400.5,it.k,7);
    if(it.newYr&&it.yr!=='9999')h+=`<div class="a mono b fP m cK" style="left:${x-46}px;top:${up?408:374}px;font-size:10px;padding:3px 5px 2px;letter-spacing:.08em">${it.yr}</div>`;
    h+=`<button class="tl ${up?'up':'dn'}" data-page="${it.pg}" style="left:${x-20}px;${up?'bottom:'+(707-368)+'px;flex-direction:column-reverse':'top:432px'}" aria-label="${esc(it.t)}, ${it.dt}. Go to page ${it.pg+1}">
      <span class="lab">${esc(it.t)}</span><span class="dt ${it.k==='games'?'cT':'cP'}">${it.dt}</span></button>`;
  });
  if(j===0){
    h+=`<div class="a D cP m" style="left:24px;top:44px;font-size:74px;font-stretch:58%;line-height:.84">THE<br>WHOLE<br>THING,<br>IN ORDER.</div>
    <div class="a ser it cT" style="left:24px;top:322px;font-size:23px;width:210px;line-height:1">2018 → today. ${TLI.length} stops. Tap any of them.</div>
    <div class="a mono" style="left:24px;top:440px;font-size:10px;width:180px;line-height:1.5">${Object.entries(KC).map(([k,c])=>`<span style="display:inline-block;position:relative;width:12px;height:10px;margin-right:6px">${c.map((ink,i)=>`<i class="m" style="position:absolute;left:${i*2}px;top:${-i}px;width:10px;height:10px;border-radius:50%;background:${INK[ink]}"></i>`).join('')}</span>${k==='woodworking'?'woodwork':k}`).join('<br>')}</div>`;
  }
  if(j===3){
    h+=`<div class="a D cT m" style="left:452px;top:40px;font-size:40px;font-stretch:60%;writing-mode:vertical-rl;line-height:1">TO BE CONTINUED →</div>`;
  }
  return h;
}

const inv=x=>op(x,'difference','#fff');

let RK=2; // device px per design unit for halftones
async function renderHT(cv){

  const im=await loadImg(cv.dataset.id);if(!im)return;
  const W=Math.max(8,Math.round(wU*k)),H=Math.max(8,Math.round(hU*k));
  const G=mk(W,H),gx=G.getContext('2d');
  gx.fillStyle='#fff';gx.fillRect(0,0,W,H);
  const ir=im.naturalWidth/im.naturalHeight,br=W/H;let sx,sy,sw,sh;
  if(ir>br){sh=im.naturalHeight;sw=sh*br;sx=(im.naturalWidth-sw)*(o.fx??.5);sy=0}
  else{sw=im.naturalWidth;sh=sw/br;sx=0;sy=(im.naturalHeight-sh)*(o.fy??.5)}
  gx.drawImage(im,sx,sy,sw,sh,0,0,W,H);
  op(gx,'saturation','#808080');
  if(!o.inv)inv(gx);              // now: darkness / ink density
  lin(gx,o.c??1.15,o.b??-.05);

  const ox=cv.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,W,H);
  const inks=o.inks||['T','P'];

  const npat=Math.max(3,Math.round(cell));
  inks.forEach((ink,i)=>{
    const T=mk(W,H),tx=T.getContext('2d');tx.drawImage(G,0,0);

  if(htBusy)return;htBusy=true;

function pageCanvases(idxs){

  if(idxs.includes(9)||idxs.includes(10))out.push(...flapB.querySelectorAll('canvas.ht'));

/* ---------- state ---------- */
let mode='spread',s=1,vw=0,vh=0,pos=0,anim=null,bend=0,bendDir=1,turner=null;
let fold=0,foldAnim=null,panC=250,panMode=false;
let mag=1,pX=0,pY=0,magAnim=null;
const maxPos=()=>mode==='spread'?L:NP-1;
const prog=k=>c01(mode==='spread'?pos-k:pos-2*k);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const smooth=t=>t*t*(3-2*t);

function layout(){
  vw=innerWidth;vh=innerHeight;
  const single=vw<720||vw<vh*.82;
  const newMode=single?'single':'spread';
  if(newMode!==mode){
    if(newMode==='single')pos=Math.round(pos)===0?0:Math.min(NP-1,2*Math.round(pos)-1);
    else{const p=Math.round(pos);pos=p%2?(p+1)/2:p/2}
    mode=newMode;killTurner();
  }
  s=single?Math.min((vw-18)/PW,(vh-112)/PH):Math.min((vw-80)/(2*PW),(vh-118)/PH);
  s=Math.max(.2,s);
  const z=Math.min(1,(vw-40)/(2000*s));
  panMode=single||z<.5;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const nk=Math.round(Math.min(2.6,Math.max(1,s*dpr*1.05))*10)/10;
  if(Math.abs(nk-RK)/RK>.18||!layout.done){RK=nk;layout.done=1;refreshHT()}
  render();
}
function nearPages(){
  const c=mode==='spread'?Math.round(pos)*2:Math.round(pos);
  return[c-1,c,c-2,c+1,c+2,c-3,c+3,c+4,c-4];
}
function refreshHT(){
  queueHT(pageCanvases(nearPages()),true);
  // the rest of the print run, in the background
  setTimeout(()=>queueHT(pageCanvases([...Array(NP).keys()]),false),400);
}

/* ---------- turner: the bending leaf, built from vertical strips ---------- */
function clonePage(src,pairs){
  const c=src.cloneNode(true);
  const sc=src.querySelectorAll('canvas'),dc=c.querySelectorAll('canvas');
  sc.forEach((s0,i)=>{copyCanvas(s0,dc[i]);if(s0.classList.contains('ht'))pairs.push([s0,dc[i]])});
  c.querySelectorAll('a,button').forEach(e=>e.setAttribute('tabindex','-1'));
  return c;
}
function copyCanvas(a,b){if(!a.width)return;b.width=a.width;b.height=a.height;b.getContext('2d').drawImage(a,0,0)}
function syncClones(cv){if(turner)turner.pairs.forEach(([a,b])=>{if(a===cv)copyCanvas(a,b)})}
function buildTurner(k){
  killTurner();
  const N=mode==='spread'?12:8,w=PW/N;
  const root=document.createElement('div');root.className='turner';root.setAttribute('aria-hidden','true');
  root.style.transform=`translateZ(${L*.5+3}px)`;
  const fsrc=leaves[k].f.querySelector('.page'),bsrc=leaves[k].b.querySelector('.page');
  const pairs=[],strips=[];let parent=root;
  for(let i=0;i<N;i++){
    const st=document.createElement('div');st.className='strip';st.style.left=(i?w:0)+'px';st.style.width=w+'px';
    const ff=document.createElement('div');ff.className='sface';ff.style.width=(w+1.4)+'px';
    const fc=clonePage(fsrc,pairs);fc.style.left=(-i*w)+'px';
    const fsh=document.createElement('div');fsh.className='sshade';ff.append(fc,fsh);
    const bf=document.createElement('div');bf.className='sface back';bf.style.width=(w+1.4)+'px';bf.style.left='-1.4px';
    const bc=clonePage(bsrc,pairs);bc.style.left=(-(PW-(i+1)*w)-1.4)+'px';
    const bsh=document.createElement('div');bsh.className='sshade';bf.append(bc,bsh);
    st.append(ff,bf);parent.append(st);parent=st;
    strips.push({st,fsh,bsh});
  }
  book.append(root);
  turner={k,root,strips,pairs,N,w};
}
function killTurner(){if(turner){turner.root.remove();turner=null}}
function updateTurner(r){
  const t=turner,N=t.N;
  const a=bendDir*bend*.42*Math.sin(Math.PI*r);
  const phi=u=>Math.PI*c01(r+a*(Math.pow(u,1.5)-.42));
  const shF=x=>((1-Math.cos(x))*.26).toFixed(3),shB=x=>((1+Math.cos(x))*.26).toFixed(3);
  let prev=0,xe=0;
  for(let i=0;i<N;i++){
    const th=phi((i+.5)/N),a0=phi(i/N),a1=phi((i+1)/N),S=t.strips[i];
    S.st.style.transform=`rotateY(${(-(th-prev)).toFixed(4)}rad)`;
    prev=th;xe+=t.w*Math.cos(th);
    S.fsh.style.background=`linear-gradient(90deg,rgba(26,20,40,${shF(a0)}),rgba(26,20,40,${shF(a1)}))`;
    S.bsh.style.background=`linear-gradient(90deg,rgba(26,20,40,${shB(a1)}),rgba(26,20,40,${shB(a0)}))`;
  }
  return xe;
}

/* ---------- render ---------- */
function camBase(){return mode==='spread'?(pos<1?-250*(1-pos):pos>L-1?250*(pos-(L-1)):0):-250*Math.cos(Math.PI*pos)}
let lastStack='';
function render(){
  const sp=mode==='spread';
  let turning=-1;
  for(let k=0;k<L;k++){const r=prog(k);if(r>0&&r<1){turning=k;break}}
  if(turning>=0&&bend>0){if(!turner||turner.k!==turning)buildTurner(turning)}
  else if(turner)killTurner();
  const c=sp?Math.floor(pos):Math.floor(pos/2);
  const lo=c-2,hi=c+1;
  let xe=null,sinA=0;
  for(let k=0;k<L;k++){
    const lf=leaves[k],r=prog(k);
    const show=(k>=lo&&k<=hi)||k===turning;
    lf.el.style.display=show?'':'none';
    if(!show)continue;
    if(k===turning&&turner){lf.el.style.visibility='hidden';xe=updateTurner(r);sinA=Math.sin(Math.PI*r);continue}
    lf.el.style.visibility='';
    const z=k===turning?L*.5+3:(r>=.5?k*.5:(L-k)*.5);
    lf.el.style.transform=`translateZ(${z}px) rotateY(${(-180*r).toFixed(3)}deg)`;
    lf.fs.style.opacity=r>0&&r<1?((1-Math.cos(Math.PI*r))*.26).toFixed(3):0;
    lf.bs.style.opacity=r>0&&r<1?((1+Math.cos(Math.PI*r))*.26).toFixed(3):0;
    if(k===turning){xe=PW*Math.cos(Math.PI*r);sinA=Math.sin(Math.PI*r)}
  }
  // cast shadows of the lifted leaf
  if(xe!==null&&sinA>.001){
    const A=(.42*sinA).toFixed(3),len=(30+90*sinA).toFixed(1),sp2=(.3*sinA).toFixed(3);
    if(xe>=0){
      castR.style.background=`linear-gradient(90deg,transparent ${xe-1}px,rgba(20,15,30,${A}) ${xe}px,transparent ${xe+ +len}px)`;
      castL.style.background=`linear-gradient(270deg,rgba(20,15,30,${sp2}),transparent ${60+80*sinA}px)`;
    }else{
      const xl=PW+xe;
      castL.style.background=`linear-gradient(270deg,transparent ${PW-xl-1}px,rgba(20,15,30,${A}) ${PW-xl}px,transparent ${PW-xl+ +len}px)`;
      castR.style.background=`linear-gradient(90deg,rgba(20,15,30,${sp2}),transparent ${60+80*sinA}px)`;
    }
    castL.style.transform=castR.style.transform=`translateZ(${L*.5+1}px)`;
    castL.style.display=castR.style.display='';
  }else{castL.style.display=castR.style.display='none'}
  // paper thickness: stacks of leaf edges on each side
  const nl=sp?pos:pos/2,nr=L-nl;
  const key=Math.round(nl*4)+'|'+mode+(nl<.02)+(nr<.02);
  if(key!==lastStack){lastStack=key;
    const edges=(n,dir)=>{let sh=[];const m=Math.round(n*1.1);for(let j=1;j<=m;j++)sh.push(`${dir*j*.85}px ${j*.55}px 0 ${j%2?'#d6ccb8':'#efe8d8'}`);
      sh.push(`${dir*(m*.85+.6)}px ${m*.55+.6}px 0 rgba(0,0,0,.25)`);sh.push(`${dir*8}px 26px 40px rgba(0,0,0,.45)`);return sh.join(',')};
    stackL.style.boxShadow=edges(nl,-1);stackR.style.boxShadow=edges(nr,1);
    stackL.style.display=nl<.02?'none':'';stackR.style.display=nr<.02?'none':'';
  }
  // camera
  let cx=camBase();
  const fe=ease(c01(fold));
  let zoom=1,cU=cx;
  if(fold>0){
    if(panMode){cU=-panC}else{cU=-500;zoom=1+(Math.min(1,(vw-40)/(2000*s))-1)*fe}
    cx=cx+(cU-cx)*fe;
  }
  const S=s*zoom*mag;
  const tilt=sp&&mag===1?(4*(1-fe)):0;
  cam.style.transform=`translate3d(${((cx+pX)*S).toFixed(2)}px,${(pY*S+(sp?-6:-10)).toFixed(2)}px,0) scale3d(${S},${S},${S}) rotateX(${tilt}deg)`;
  // flaps
  if(fold>0){
    const oB=smooth(c01(fold*2)),oC=smooth(c01(fold*2-1));
    flapB.style.display=flapC.style.display='block';
    flapB.style.transform=`translateZ(1px) rotateY(${-180*(1-oB)}deg)`;
    flapC.style.transform=`translateZ(.5px) rotateY(${-180*(1-oC)}deg)`;
    pullLayer.style.visibility='hidden';
  }else{flapB.style.display='none';pullLayer.style.visibility=''}
}

/* ---------- navigation ---------- */
function stopAnim(){if(anim){cancelAnimationFrame(anim.raf);anim=null}}
function animateTo(t,o){
  o=o||{};
  t=clamp(t,0,maxPos());stopAnim();
  const from=pos,n=Math.abs(t-from);
  if(n<1e-4){pos=t;bend=0;render();settle();return}
  const riffle=n>1.01;
  bend=o.bend??(riffle?0:.85);bendDir=t>from?1:-1;
  if(reduced){pos=t;bend=0;render();settle();return}
  const dur=o.dur??(riffle?Math.min(2400,380+n*170):(o.fromDrag?260+380*n:720));
  const t0=performance.now(),ez=o.fromDrag?(u=>1-Math.pow(1-u,3)):ease;
  const step=now=>{
    const u=c01((now-t0)/dur);pos=from+(t-from)*ez(u);render();
    if(u<1)anim={raf:requestAnimationFrame(step),target:t};else{anim=null;pos=t;bend=0;render();settle()}
  };
  anim={raf:requestAnimationFrame(step),target:t};
}
function go(d){
  if(fold>0){setFold(0);return}
  if(mag>1){setMag(1);return}
  const base=anim?anim.target:Math.round(pos);
  animateTo(base+d);
}
function pageToPos(i){return mode==='spread'?(i===0?0:i%2?(i+1)/2:i/2):i}
function goPage(i){
  const doit=()=>{setMag(1,true);animateTo(pageToPos(i))};
  if(fold>0){setFold(0,doit)}else doit();
}
const lbl=document.getElementById('lbl');
let hinted=false;
function settle(){
  const sp=mode==='spread';
  let txt,pg;
  if(sp){
    const sI=Math.round(pos);
    if(sI===0){txt='COVER';pg=[0]}else if(sI===L){txt='BACK COVER';pg=[NP-1]}
    else{txt=`pp. ${String(2*sI).padStart(2,'0')}–${String(2*sI+1).padStart(2,'0')} / ${NP}`;pg=[2*sI-1,2*sI]}
  }else{
    const p=Math.round(pos);pg=[p];txt=p===0?'COVER':p===NP-1?'BACK COVER':`p. ${String(p+1).padStart(2,'0')} / ${NP}`;
  }
  lbl.textContent=txt;
  document.getElementById('prev').disabled=pos<=0;
  document.getElementById('next').disabled=pos>=maxPos();
  // accessibility: only the visible pages are exposed
  leaves.forEach((lf,k)=>{
    lf.f.setAttribute('aria-hidden',pg.includes(2*k)?'false':'true');
    lf.b.setAttribute('aria-hidden',pg.includes(2*k+1)?'false':'true');
    lf.f.inert=!pg.includes(2*k);lf.b.inert=!pg.includes(2*k+1);
  });
  flapB.inert=!(fold>=1);
  queueHT(pageCanvases(nearPages()),true);
  if(pos>0&&!hinted){hinted=true;document.getElementById('hint').classList.add('gone')}
}
function atCentre(){return mode==='spread'?pos===CL:pos===2*CL}
function setFold(target,cb){
  if(!atCentre()&&target>0)return;
  if(foldAnim)cancelAnimationFrame(foldAnim);
  if(target>0&&panMode)panC=250;
  const from=fold,t0=performance.now(),dur=reduced?0:1500*Math.abs(target-from);
  const fb=document.getElementById('foldbtn');
  const step=now=>{
    const u=dur?c01((now-t0)/dur):1;
    fold=from+(target-from)*u;
    if(panMode&&target>0)panC=250+(750-250)*smooth(c01(u*1.2-.2))*(1);
    render();
    if(u<1)foldAnim=requestAnimationFrame(step);
    else{foldAnim=null;fold=target;render();fb.style.display=fold>0?'block':'none';settle();if(cb)cb()}
  };
  if(target===0)fb.style.display='none';
  foldAnim=requestAnimationFrame(step);
}
function animPan(t){
  const from=panC,t0=performance.now();
  const step=now=>{const u=reduced?1:c01((now-t0)/380);panC=from+(t-from)*(1-Math.pow(1-u,3));render();if(u<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function setMag(m,instant,bx,by){
  if(magAnim)cancelAnimationFrame(magAnim);
  const f0=mag,x0=pX,y0=pY;
  let tx=0,ty=0;
  if(m>1){
    // keep the tapped book point under the finger
    const cx=camBase();
    tx=(bx+cx)*(1/m-1);ty=by*(1/m-1);
  }
  if(instant||reduced){mag=m;pX=tx;pY=ty;render();return}
  const t0=performance.now();
  const step=now=>{const u=c01((now-t0)/320),e=1-Math.pow(1-u,3);mag=f0+(m-f0)*e;pX=x0+(tx-x0)*e;pY=y0+(ty-y0)*e;render();if(u<1)magAnim=requestAnimationFrame(step);else magAnim=null};
  magAnim=requestAnimationFrame(step);
}

/* ---------- pointer: drag the page corner, swipe, tap, double-tap to zoom ---------- */
let drag=null,suppressClick=false,lastTap=null,tapTimer=null;
const toBook=(cxs,cys)=>{ // screen -> book units relative to spine/centre (ignores tilt)
  const cx=camBase();
  const S=s*mag;return[(cxs-vw/2)/S-cx-pX,(cys-vh/2)/S-pY];
};
vp.addEventListener('pointerdown',e=>{
  if(e.button>0||idxOpen)return;
  if(e.target.closest('a'))return;
  stopAnim();
  const[ex,ey]=toBook(e.clientX,e.clientY);
  drag={id:e.pointerId,x0:e.clientX,y0:e.clientY,t0:performance.now(),pos0:pos,ex0:ex,ey0:ey,moved:false,hist:[[performance.now(),pos]],pan0:panC,pX0:pX,pY0:pY,tgt:e.target};
  try{vp.setPointerCapture(e.pointerId)}catch(_){}
});
vp.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.moved){if(Math.hypot(dx,dy)<7)return;drag.moved=true;if(tapTimer){clearTimeout(tapTimer);tapTimer=null}}
  if(mag>1){const S=s*mag;pX=drag.pX0+dx/S;pY=drag.pY0+dy/S;const lim=PW*.9;pX=clamp(pX,-lim*1.6,lim*1.6);pY=clamp(pY,-PH*.45,PH*.45);render();return}
  if(fold>0){
    if(panMode){panC=clamp(drag.pan0-dx/s,-250,1250);render()}
    return;
  }
  if(mode==='spread'){
    if(drag.k===undefined){
      const p0=drag.pos0;
      if(Number.isInteger(p0)){drag.dir=drag.ex0>=0?1:-1;drag.k=drag.dir>0?p0:p0-1}
      else{drag.k=Math.floor(p0);drag.dir=drag.ex0>=PW*Math.cos(Math.PI*(p0-drag.k))?1:-1}
      if(drag.k<0||drag.k>=L){drag.k=null}
      else{drag.off=PW*Math.cos(Math.PI*(p0-drag.k))-drag.ex0;drag.tg=drag.dir>0?-PW:PW}
    }
    if(drag.k===null)return;
    const[ex]=toBook(e.clientX,e.clientY);
    const f=c01((ex-drag.tg)/(drag.ex0-drag.tg));
    const ee=ex+drag.off*f;
    const p=Math.acos(clamp(ee/PW,-1,1))/Math.PI;

  }else{
    const p0=drag.pos0;

    bend=1;bendDir=dx<0?1:-1;
  }
  const now=performance.now();drag.hist.push([now,pos]);if(drag.hist.length>8)drag.hist.shift();
  render();
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(d.moved){
    suppressClick=true;setTimeout(()=>suppressClick=false,0);
    if(mag>1)return;
    if(fold>0){if(panMode){const v=(e.clientX-d.x0);let t=Math.round(panC/500+.5)*500-250;if(Math.abs(v)>40&&Math.abs(t-d.pan0)<1)t+=v<0?500:-500;animPan(clamp(t,-250,1250))}return}
    const h=d.hist,a=h[0],b=h[h.length-1];const v=(b[1]-a[1])/Math.max(1,b[0]-a[0]);
    let t=v>.0012?Math.ceil(pos):v<-.0012?Math.floor(pos):Math.round(pos);
    animateTo(t,{fromDrag:true,bend:1});
    return;
  }
  // a tap
  if(d.tgt.closest('button,a'))return;
  const now=performance.now();
  if(lastTap&&now-lastTap.t<300&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<40){
    clearTimeout(tapTimer);tapTimer=null;lastTap=null;
    if(mag>1)setMag(1);else{const[bx,by]=toBook(e.clientX,e.clientY);setMag(mode==='spread'?1.9:2.3,false,bx,by)}
    return;
  }

  if(mag>1||fold>0)return;

vp.addEventListener('pointerup',endDrag);
vp.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id){drag=null;animateTo(Math.round(pos),{fromDrag:true})}});
document.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopPropagation()}},true);
vp.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('pull')){setFold(1);return}
  if(b.dataset.fold){setFold(0);return}
  if(b.dataset.page!=null){goPage(+b.dataset.page)}
});
vp.addEventListener('wheel',e=>{
  if(fold>0||mag>1)return;
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>25&&!anim){go(e.deltaX>0?1:-1)}
},{passive:true});

/* ---------- keyboard + chrome ---------- */
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.getElementById('foldbtn').onclick=()=>setFold(0);
addEventListener('keydown',e=>{
  if(idxOpen){if(e.key==='Escape')closeIdx();return}

});

}
let idxReturn=null;
function openIdx(){idxOpen=true;idxReturn=document.activeElement;idx.classList.add('open');sheet.querySelector('[data-close]').focus()}
function closeIdx(){idxOpen=false;idx.classList.remove('open');if(idxReturn&&idxReturn.focus)idxReturn.focus()}
document.getElementById('idxbtn').onclick=openIdx;
idx.addEventListener('click',e=>{
  if(e.target===idx||e.target.closest('[data-close]')){closeIdx();return}
  const g=e.target.closest('[data-goto]');if(g){closeIdx();goPage(+g.dataset.goto)}
});

/* ---------- boot ---------- */
addEventListener('resize',()=>{clearTimeout(layout.t);layout.t=setTimeout(layout,120)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&anim){const a=anim;stopAnim();pos=Math.round(pos);bend=0;render();settle()}});
if(matchMedia('(pointer:coarse)').matches)document.getElementById('hint').textContent='swipe or drag the page · double-tap to zoom';
layout();settle();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render());
// test hook
window.__zine={go,goPage,setFold,get pos(){return pos}};
})();
</script>
