  sh.style.width=it.w+'px';sh.style.height=it.h+'px';

const hashN=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const sx=xf*xf*(3-2*xf),sy=yf*yf*(3-2*yf);
  const a=hashN(xi,yi),b=hashN(xi+1,yi),c=hashN(xi,yi+1),d=hashN(xi+1,yi+1);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}
function fbm(x,y){return vnoise(x,y)*.55+vnoise(x*2.1,y*2.1)*.28+vnoise(x*4.3,y*4.3)*.17}
let woodTile=null;
function makeWood(w){
  const ph=Math.round(150*u), n=6, th=ph*n;
  const cv=document.createElement('canvas');cv.width=w;cv.height=th;
  const ctx=cv.getContext('2d');const id=ctx.createImageData(w,th);const D=id.data;
  const r=rng(99);
  for(let p=0;p<n;p++){
    const base=[188+r()*22,138+r()*18,88+r()*16], seed=r()*100, freq=.25+r()*.2;
    const knots=[];if(r()<.6)knots.push([r()*w,ph*(.25+r()*.5)]);
    for(let ly=0;ly<ph;ly++){const y=p*ph+ly;
      for(let x=0;x<w;x++){
        let warp=16*fbm(x*.0022+seed,ly*.018+seed);
        for(const k of knots){const dx=(x-k[0])/3.2,dy=ly-k[1];const r2=dx*dx+dy*dy;warp+=320*dy/(r2+90)}
        const t=(ly+warp)*freq+2.2*fbm(x*.008,ly*.04+seed);
        const ring=.5+.5*Math.sin(t);
        const late=Math.pow(ring,7);
        const fib=vnoise(x*.09+seed,ly*1.3);
        const broad=fbm(x*.0016+seed*3,ly*.006);
        let m=1-.17*late-.07*fib+.1*(broad-.5);
        if(ly<2)m*=.55;else if(ly<4)m*=.85;else if(ly>ph-3)m*=1.06;
        const i=(y*w+x)*4;D[i]=base[0]*m;D[i+1]=base[1]*m;D[i+2]=base[2]*m;D[i+3]=255}}
  }
  ctx.putImageData(id,0,0);return cv;
}

  if(f===16)return(w+1)+'″';return(w?w:'')+(f?(w?' ':'')+fr[f]:(w?'':'0'))+'″'}
function drawTape(){const ex=tapeExit();let tip;
  if(tapeState.ret!=null){const k=tapeState.ret;tip={x:ex.x+(tapeState.tx-ex.x)*k,y:ex.y+(tapeState.ty-ex.y)*k}}
  else tip=toWorld(tapeState.cx,tapeState.cy);
  const dx=ex.x-tip.x,dy=ex.y-tip.y,len=Math.hypot(dx,dy);tapeState.len=len;tapeState.tx=tip.x;tapeState.ty=tip.y;
  tapeEl.style.width=len+'px';tapeEl.style.transform='translate('+tip.x+'px,'+tip.y+'px) rotate('+Math.atan2(dy,dx)+'rad)';
  const inch=len/PPI;readout.innerHTML=fmtIn(inch)+'<small>'+(inch*2.54).toFixed(1)+' cm</small>';
  readout.style.transform='translate('+(tip.x+14)+'px,'+(tip.y-44*u)+'px) rotate(-2deg)';
  readout.style.opacity=tapeState.ret!=null?0:1;
}
function endTape(){const st=tapeState;if(st.ret!=null)return;const ex=tapeExit();const dx=st.tx-ex.x,dy=st.ty-ex.y,L=Math.hypot(dx,dy)||1;
  st.ret=1;const t0=performance.now(),dur=Math.min(600,180+L*.4);
  (function step(t){const k=Math.min(1,(t-t0)/dur);st.ret=1-k*k;if(k<1)requestAnimationFrame(step);else{tapeEl.style.display='none';readout.style.display='none';tapeState=null;
    if(M&&!RM){M.Body.setVelocity(tapeIt.b,{x:dx/L*Math.min(14,L/40),y:dy/L*Math.min(14,L/40)});M.Body.setAngularVelocity(tapeIt.b,(Math.random()-.5)*.3)}}})(t0);
}

/* ---------- inspect ---------- */
const insp=$('#insp'), flip=$('#flip'), front=insp.querySelector('.front'), back=insp.querySelector('.back');
insp.open=false;
function backHTML(d){return '<div class="bk-in">'+(d.kick?'<div class="kick">'+esc(d.kick)+'</div>':'')+'<h2>'+esc(d.title)+'</h2>'+(d.line?'<p class="line">'+esc(d.line)+'</p>':'')+
  (d.img?'<figure><img src="'+d.img+'" alt="'+esc(d.title)+'"></figure>':'')+(d.body||'')+(d.href?'<a class="lnk" href="'+esc(d.href)+'" target="_blank" rel="noopener">'+esc(d.hrefLabel||'Open')+' ↗</a>':'')+'</div>'}
function normA(a){return Math.atan2(Math.sin(a),Math.cos(a))}
let cur=null, flipped=false, anim=null;
function benchTf(it,S){const b=it.b, r=worldEl.getBoundingClientRect();const sx=b.position.x+r.left-innerWidth/2, sy=b.position.y+r.top-innerHeight/2;
  return 'translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px) rotate('+normA(b.angle).toFixed(4)+'rad) scale('+(1/S).toFixed(4)+')'}
function openInspect(it){
  if(!it.detail||insp.open)return;hideHint();if(drag)endDrag();
  insp.open=true;cur=it;flipped=false;
  const vw=innerWidth,vh=innerHeight;
  const S=Math.min(vw*.86/it.w,vh*.7/it.h,MOB?3.4:3.6);cur.S=S;
  front.innerHTML='';const fc=it.el.cloneNode(true);fc.removeAttribute('tabindex');fc.removeAttribute('role');fc.classList.remove('held');
  fc.style.transform='scale('+S+')';fc.style.width=it.w+'px';fc.style.height=it.h+'px';front.append(fc);
  front.style.width=it.w*S+'px';front.style.height=it.h*S+'px';
  front.classList.toggle('round',!!it.r);front.style.borderRadius=getComputedStyle(it.el).borderRadius.replace(/[\d.]+px/g,v=>parseFloat(v)*S+'px');
  back.className='face back bk-'+it.detail.style;back.innerHTML=backHTML(it.detail);back.scrollTop=0;
  it.wrap.style.visibility='hidden';if(it.m)it.m.w.style.visibility='hidden';
  insp.classList.add('on');document.body.classList.add('insp');requestAnimationFrame(()=>insp.classList.add('vis'));
  const from=benchTf(it,S)+' rotateY(0deg)';
  if(RM){flipped=true;flip.style.transform='rotateY(180deg)';}
  else{flipped=true;
    anim=flip.animate([{transform:from},{transform:'translate(0px,0px) rotate(0rad) scale(1.08) rotateY(0deg)',offset:.5},{transform:'translate(0px,0px) rotate(0rad) scale(1) rotateY(0deg)',offset:.62},{transform:'translate(0px,0px) rotate(0rad) scale(1) rotateY(180deg)'}],
      {duration:1250,easing:'cubic-bezier(.3,.7,.25,1)',fill:'forwards'});
    anim.onfinish=()=>{flip.style.transform='translate(0px,0px) rotate(0rad) scale(1) rotateY(180deg)';anim.cancel();anim=null}}
  setTimeout(()=>insp.querySelector('.close').focus({preventScroll:true}),RM?0:600);
}
function toggleFlip(){if(!insp.open||anim)return;const a=flipped?180:0,b=flipped?0:180;flipped=!flipped;
  if(RM){flip.style.transform='rotateY('+b+'deg)';return}
  anim=flip.animate([{transform:'translate(0px,0px) rotate(0rad) scale(1) rotateY('+a+'deg)'},{transform:'translate(0px,0px) rotate(0rad) scale(1.05) rotateY('+(a+b)/2+'deg)'},{transform:'translate(0px,0px) rotate(0rad) scale(1) rotateY('+b+'deg)'}],{duration:650,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
  anim.onfinish=()=>{flip.style.transform='translate(0px,0px) rotate(0rad) scale(1) rotateY('+b+'deg)';anim.cancel();anim=null}}
function closeInspect(){if(!insp.open||!cur)return;const it=cur;
  const done=()=>{insp.classList.remove('on','vis');document.body.classList.remove('insp');flip.style.transform='';it.wrap.style.visibility='';if(it.m)it.m.w.style.visibility='';insp.open=false;cur=null;it.lift=1;it.liftT=0;raise(it);try{it.el.focus({preventScroll:true})}catch(_){}};
  if(anim){anim.cancel();anim=null}
  insp.classList.remove('vis');
  if(RM){done();return}
  const a=flipped?180:0;
  anim=flip.animate([{transform:'translate(0px,0px) rotate(0rad) scale(1) rotateY('+a+'deg)'},{transform:'translate(0px,0px) rotate(0rad) scale(1.04) rotateY(0deg)',offset:.4},{transform:benchTf(it,it.S)+' rotateY(0deg)'}],{duration:a?900:600,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'});
  anim.onfinish=()=>{anim.cancel();anim=null;done()}}
flip.addEventListener('click',e=>{if(e.target.closest('a'))return;if(flipped&&e.target.closest('.back')&&getSelection().toString())return;toggleFlip()});
insp.querySelector('.bd').addEventListener('click',closeInspect);
insp.querySelector('.close').addEventListener('click',closeInspect);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(insp.open)closeInspect();else if(idx.classList.contains('on'))toggleIdx(false)}
  else if(insp.open&&e.key==='f'){toggleFlip()}});

/* ---------- index panel ---------- */
const idx=$('#idx');
(function(){let h='<button class="btn x" type="button">Close</button><h2>'+esc(C.name)+'</h2><p>'+esc(C.title)+'</p>';
  GROUPS.forEach(g=>{const list=items.filter(it=>it.group===g.k&&it.detail);if(!list.length)return;
    h+='<h3>'+esc(g.t)+'</h3>';list.forEach(it=>{const i=items.indexOf(it);h+='<button class="e" type="button" data-i="'+i+'">'+esc(it.detail.title)+(it.p&&it.p.date?'<span>'+it.p.date.slice(0,4)+'</span>':'')+'</button>'})});
  idx.innerHTML=h;
  idx.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('x')){toggleIdx(false);return}
    const it=items[+b.dataset.i];toggleIdx(false);
    const y=it.b.position.y;if(y<scroller.scrollTop+40||y>scroller.scrollTop+H-80)scroller.scrollTop=Math.max(0,y-H/2);
    setTimeout(()=>openInspect(it),RM?0:250)});
})();
function toggleIdx(v){idx.classList.toggle('on',v);$('#idxBtn').setAttribute('aria-expanded',v);if(v)setTimeout(()=>idx.querySelector('.x').focus(),50);else $('#idxBtn').focus({preventScroll:true})}
$('#idxBtn').addEventListener('click',()=>toggleIdx(!idx.classList.contains('on')));
$('#tidyBtn').addEventListener('click',()=>{hideHint();setTidy(!tidy,true)});

/* ---------- hint ---------- */
let hintT=setTimeout(hideHint,14000);
function hideHint(){const h=$('#hint');if(!h.classList.contains('gone'))h.classList.add('gone')}

/* ---------- boot ---------- */
setWorldH(H);
const startTidy=MOB||RM;
const L0=startTidy?tidyTargets():messyTargets();
if(L0.h>WH)setWorldH(L0.h);
tidy=startTidy;document.body.classList.toggle('tidy',tidy);$('#tidyBtn span:last-child').textContent=tidy?'Mess it up':'Tidy up';
items.forEach((it,i)=>{const t=L0.t.get(it);makeBody(it,t.x,t.y,t.a);
  it.wrap.style.zIndex=it===lensIt?9000:it===tapeIt?7000:++ztop;if(it.m)it.m.w.style.zIndex=it.wrap.style.zIndex;
  if(!RM){it.wrap.classList.add('pre');it.lift=it.liftT=1;setTimeout(()=>{it.wrap.classList.remove('pre');it.liftT=0},120+i*35)}});
buildWalls();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>drawBench());

let last=performance.now(),acc=0;const STEP=1000/60;
function frame(t){requestAnimationFrame(frame);
  if(document.hidden){last=t;return}
  let dt=Math.min(50,t-last);last=t;
  runTweens(t);
  if(M){acc+=dt;let n=0;while(acc>=STEP&&n<4){M.Engine.update(engine,STEP);acc-=STEP;n++}if(n===4)acc=0}
  render();
}
requestAnimationFrame(frame);

let rzT=null;
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{
  const oW=W;W=innerWidth;H=innerHeight;
  if(tidy){const L=tidyTargets();setWorldH(L.h);L.t.forEach((t,it)=>setPos(it,t.x,t.y,t.a))}
  else{setWorldH(H);items.forEach(it=>{const b=it.b;setPos(it,Math.max(30,Math.min(W-30,b.position.x*W/oW)),Math.max(30,Math.min(WH-30,b.position.y)),b.angle)})}
  lightDirty=true},200)});
})();
</script>
